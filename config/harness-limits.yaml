# ─────────────────────────────────────────────────────────────────────────────
# Banker Copilot — subagent fan-out limits (epic #332 §6.3)
#
# This file is the SINGLE home of the fan-out concurrency bounds, per invariant I-3
# ("all thresholds are configuration-driven; zero hardcoded counts in application code").
# The fan-out engine (banker-copilot-service, `asyncio.gather` per §6.1/§6.5) reads these and
# has NO fallback literals — a missing or invalid file aborts startup, exactly like the tool
# manifest, because a harness that cannot state its own concurrency ceiling must not spawn.
#
# Baked into the image so the container is self-consistent in docker-compose and CI, and
# overridable by a read-only bind mount / ConfigMap at the same path to re-tune WITHOUT a
# rebuild. It is mounted read-only: a harness that could rewrite its own limits could grant
# itself unbounded fan-out.
#
# NOT restated anywhere else. Each value below has exactly one home; docker-compose and the
# kustomize base repoint the PATH to this file, they never re-declare a number (my standing
# rule — a threshold stated twice is a threshold wrong once).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: harness-limits/v1

fanout:
  # The most subagents that may run concurrently under one root harness (§6.3).
  # Concurrency costs trace legibility, and the trace pane IS the demo (§6.1), so this is
  # deliberately small.
  maxConcurrentSubagents: 4

  # Recursion ceiling. Depth 2 means the root may spawn subagents and those subagents may NOT
  # spawn their own — "no grandchildren" (§6.3). A subagent is depth 1; its child would be
  # depth 2 and is refused.
  maxSubagentDepth: 2

  # Per-subagent tool-call budget (§6.3). A runaway subagent burns its budget and stops rather
  # than the whole run.
  perSubagentToolBudget: 20

  # Per-subagent wall-clock budget in seconds (§6.3). A subagent that exceeds it is cancelled;
  # the root records the timeout and proceeds — fan-out is opt-in and a stuck leaf must never
  # wedge the case.
  subagentWallClockSeconds: 60

# ─────────────────────────────────────────────────────────────────────────────
# The primary's assessment loop and its evidence ceiling (#332 §P5).
#
# The model judges; the policy decides what it must have looked at first. Required evidence is
# gathered first and unconditionally, BEFORE the model is consulted, so no model failure, timeout
# or garbage reply can reduce evidence below policy. Beyond that floor the primary may REQUEST
# more reads — never fewer.
#
# There is no on/off flag for that ceiling, deliberately (§P5.1). It is a BUDGET. At budget 0 the
# model is asked the same question, its reply is parsed by the same parser, its requests are
# recorded, and the additions function is called and returns empty. Stage 1 is the loop running
# zero iterations, not the loop switched off — so what stage 1 measures is the path that ships.
# ─────────────────────────────────────────────────────────────────────────────
assessment:
  # STAGE 1 (this deployment): 0. The assessment is real; no discretionary read is granted.
  # Refused requests are still recorded, which is how we measure the DEMAND for the ceiling
  # before the ceiling runs — real evidence for whether the stage-2 value is right.
  #
  # STAGE 2: 3, raised deliberately after stage 1 is measured. Rationale for 3: the registry
  # holds twelve read tools and required sets are one to three, so three additional roughly
  # doubles the evidence surface while keeping the trace legible — the same yardstick that puts
  # maxConcurrentSubagents at 4 above. It is PER-RUN, not per-iteration: two passes cannot spend
  # three each.
  perRunAdditionalToolBudget: 0

  # One initial judgement and at most one re-judge: judge → gather → judge → propose. Two is the
  # smallest number that makes this a feedback loop rather than a straight line, and it makes
  # non-convergence a single definite event instead of a decaying sequence nobody can
  # characterise. Retrying past this, in any form including a "just one more" special case, is
  # refused (§P5.6).
  maxAssessmentIterations: 2
