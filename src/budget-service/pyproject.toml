[tool.poetry]
name = "budget-service"
version = "1.0.0"
description = "Spending analysis and budget insights agent"
authors = ["Online Banking Demo"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.115.0,<1"
uvicorn = ">=0.32.0,<1"
azure-identity = ">=1.17.0,<2"
azure-ai-inference = ">=1.0.0,<2"
pydantic = {version = ">=2.11.0,<3", extras = ["email"]}
python-dotenv = ">=1.0.0,<2"
numpy = ">=2.0.0,<3"
pandas = ">=2.2.0,<3"
opentelemetry-api = ">=1.39.0,<2"
opentelemetry-sdk = ">=1.39.0,<2"
opentelemetry-exporter-otlp = ">=1.39.0,<2"
opentelemetry-instrumentation-fastapi = ">=0.60b0"
opentelemetry-instrumentation-httpx = ">=0.60b0"
azure-core-tracing-opentelemetry = ">=1.0.0b12"
httpx = ">=0.27.1,<1"
azure-core = ">=1.32.0,<2"
structlog = ">=24.1.0,<25"
PyJWT = ">=2.8.0,<3"
redis = ">=5.2.1,<6"

[tool.poetry.group.dev.dependencies]
pytest = "==8.3.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"