[tool.poetry]
name = "account-opening-service"
version = "1.0.0"
description = "Account opening service for smart onboarding"
authors = ["Online Banking Demo"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "==0.115.0"
uvicorn = "==0.32.0"
redis = "==5.2.1"
pydantic = {version = "==2.9.0", extras = ["email"]}
python-jose = {version = "==3.3.0", extras = ["cryptography"]}
httpx = "==0.27.2"
structlog = "==24.1.0"
python-dotenv = "==1.0.0"
opentelemetry-api = "==1.39.0"
opentelemetry-sdk = "==1.39.0"
opentelemetry-exporter-otlp = "==1.39.0"
opentelemetry-instrumentation-fastapi = "==0.60b0"
opentelemetry-instrumentation-httpx = "==0.60b0"
agent-framework = "==1.3.0"
agent-framework-foundry = "==1.3.0"
azure-identity = "==1.17.0"
azure-ai-contentunderstanding = "==1.1.0"
azure-ai-projects = "==2.1.0"
azure-cosmos = "==4.7.0"
azure-storage-blob = "==12.26.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
