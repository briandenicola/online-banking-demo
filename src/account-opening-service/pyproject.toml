[tool.poetry]
name = "account-opening-service"
version = "1.0.0"
description = "Account opening service for smart onboarding"
authors = ["Online Banking Demo"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = ">=0.32,<0.48"
redis = "^5.2.1"
pydantic = {version = "^2.9.0", extras = ["email"]}
python-jose = {version = "^3.3.0", extras = ["cryptography"]}
httpx = ">=0.27,<0.29"
structlog = ">=24.1,<26.0"
python-dotenv = "^1.0.0"
opentelemetry-api = "^1.27.0"
opentelemetry-sdk = "^1.27.0"
opentelemetry-exporter-otlp = "^1.27.0"
opentelemetry-instrumentation-fastapi = ">=0.46b0"
opentelemetry-instrumentation-httpx = ">=0.46b0"
agent-framework-core = "1.2.2"
agent-framework-foundry = "1.2.2"
azure-identity = "^1.17.0"
azure-ai-contentunderstanding = "*"
azure-ai-projects = ">=2.1.0"
azure-cosmos = "^4.7.0"
azure-storage-blob = "^12.26.0"
python-multipart = ">=0.0.9,<1.0.0"
aiohttp = ">=3.9.0,<4.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
