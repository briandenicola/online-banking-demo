worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Use /tmp for temp paths so container works with read-only root filesystem
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            # In K8s with Istio, requests arrive via the mesh gateway.
            # For docker-compose, the gateway container handles routing.
            # This proxy forwards to the gateway service (docker-compose)
            # or is bypassed entirely when Istio VirtualService routes /api/* directly.
            proxy_pass http://gateway:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;

            # Return 502 gracefully if gateway is not available (K8s without gateway)
            proxy_connect_timeout 2s;
            error_page 502 = @fallback_api;
        }

        location @fallback_api {
            # When no gateway is available (shouldn't happen with Istio routing)
            return 503 '{"error": "API gateway unavailable"}';
            add_header Content-Type application/json;
        }
    }
}