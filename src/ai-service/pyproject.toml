[tool.poetry]
name = "ai-service"
version = "1.0.0"
description = "Suspicious transaction detection agent"
authors = ["Online Banking Demo"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.115.0,<1"
uvicorn = ">=0.32.0,<1"
redis = ">=5.2.1,<6"
azure-identity = ">=1.17.0,<2"
azure-ai-inference = ">=1.0.0,<2"
pydantic = ">=2.11.0,<3"
python-dotenv = ">=1.0.0,<2"
scikit-learn = ">=1.5.0,<2"
numpy = ">=2.0.0,<3"
pandas = ">=2.2.0,<3"
opentelemetry-api = ">=1.39.0,<2"
opentelemetry-sdk = ">=1.39.0,<2"
opentelemetry-exporter-otlp = ">=1.39.0,<2"
opentelemetry-instrumentation-fastapi = ">=0.60b0"
opentelemetry-instrumentation-httpx = ">=0.60b0"
azure-core = ">=1.32.0,<2"
structlog = ">=24.1.0,<25"
PyJWT = ">=2.8.0,<3"
httpx = ">=0.27.1,<1"
agent-framework = ">=1.3.0,<2"
agent-framework-foundry = ">=1.3.0,<2"

[tool.poetry.group.dev.dependencies]
pytest = "==8.3.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"