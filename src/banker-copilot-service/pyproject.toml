[tool.poetry]
name = "banker-copilot-service"
version = "1.0.0"
description = "Banker Copilot agentic harness — registers ZERO write tools; propose_action is the sole write affordance"
authors = ["Online Banking Demo"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.115,<0.140"
uvicorn = ">=0.32,<0.52"
pydantic = "^2.9.0"
python-dotenv = "^1.0.0"
structlog = ">=24.1,<27.0"
PyJWT = {version = "^2.8.0", extras = ["crypto"]}
httpx = ">=0.27,<0.29"
PyYAML = "^6.0"
jsonschema = "^4.23.0"
opentelemetry-api = "^1.27.0"
opentelemetry-sdk = "^1.27.0"
opentelemetry-exporter-otlp = "^1.27.0"
opentelemetry-instrumentation-fastapi = ">=0.46b0"
opentelemetry-instrumentation-httpx = ">=0.46b0"
azure-identity = "^1.17.0"
azure-cosmos = "^4.7.0"
azure-core = "^1.32.0"
# Pinned to match src/ai-service/pyproject.toml exactly. Two services running different
# Agent Framework versions is a difference nobody notices until a trace shape diverges.
agent-framework-core = "1.16.0"
agent-framework-foundry = "1.10.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<10.0"
pytest-asyncio = ">=0.24,<2.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# Mutation testing config. This MUST live in a config file, not on the command
# line: mutmut 3.x loads config at import time, so `mutmut run --paths-to-mutate`
# — and even `mutmut run --help` — crashes before argument parsing if this
# section is absent. The workflow previously passed 2.x-era CLI flags and had
# been failing on every nightly run, which meant the Python half of mutation
# testing proved nothing. Mutation testing is the only test-quality signal this
# repo tracks (coverage is deliberately not tracked), so a mutation job that
# cannot start is a hole in the one thing we rely on.
[tool.mutmut]
# `source_paths`, not the 2.x `paths_to_mutate`, and
# `pytest_add_cli_args_test_selection`, not the 2.x `tests_dir` — both old names
# are accepted but deprecated, and neither is what 3.x looks for first.
#
# The registry is where "zero write tools registered" is enforced and the
# manifest loader is where an unconstrained path parameter is refused. A mutant
# surviving in either means a guard the epic depends on is not actually tested.
source_paths = ["app"]
# Copy the whole app so intra-package imports resolve inside the sandbox, but
# mutate ONLY the security-critical surface. Copying just `app/tools` made the
# sandbox unimportable (`No module named 'app.stores'`), and widening the
# mutation target instead would bury the signal we care about in noise from
# unrelated modules.
only_mutate = ["app/tools/*"]
pytest_add_cli_args_test_selection = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
