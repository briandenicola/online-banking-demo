[tool.poetry]
name = "chatbot-service"
version = "1.0.0"
description = "AI-powered financial advice chatbot service"
authors = ["Online Banking Demo"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.115.0,<1"
uvicorn = ">=0.32.0,<1"
azure-ai-projects = ">=2.1.0,<3"
azure-identity = ">=1.17.0,<2"
openai = ">=1.0.0,<3"
httpx = ">=0.27.1,<1"
pydantic = {version = ">=2.11.0,<3", extras = ["email"]}
python-dotenv = ">=1.0.0,<2"
opentelemetry-api = ">=1.39.0,<2"
opentelemetry-sdk = ">=1.39.0,<2"
opentelemetry-exporter-otlp = ">=1.39.0,<2"
opentelemetry-instrumentation-fastapi = ">=0.60b0"
opentelemetry-instrumentation-httpx = ">=0.60b0"
opentelemetry-instrumentation-requests = ">=0.60b0"
azure-core-tracing-opentelemetry = ">=1.0.0b12"
azure-core = ">=1.32.0,<2"
structlog = ">=24.1.0,<25"
PyJWT = ">=2.8.0,<3"
aiohttp = ">=3.11.0,<4"
agent-framework-foundry = ">=1.3.0,<2"
azure-cosmos = ">=4.7.0,<5"

[tool.poetry.group.dev.dependencies]
pytest = "==8.3.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"