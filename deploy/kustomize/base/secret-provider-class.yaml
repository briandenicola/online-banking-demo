apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: banking-secrets-provider
  namespace: banking-demo
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMkubeletIdentity: "true"
    keyvaultName: "REPLACE_WITH_KEYVAULT_NAME"
    tenantId: "REPLACE_WITH_TENANT_ID"
    clientID: "REPLACE_WITH_AZURE_CLIENT_ID"
    objects: |
      array:
        - |
          objectName: jwt-key
          objectType: secret
        - |
          objectName: openai-endpoint
          objectType: secret
        - |
          objectName: redis-connection-string
          objectType: secret
        - |
          objectName: appinsights-connection-string
          objectType: secret
        - |
          objectName: content-understanding-endpoint
          objectType: secret
  secretObjects:
  - secretName: banking-secrets
    type: Opaque
    data:
    - objectName: jwt-key
      key: jwt-key
    - objectName: openai-endpoint
      key: openai-endpoint
    - objectName: redis-connection-string
      key: redis-connection-string
    - objectName: appinsights-connection-string
      key: appinsights-connection-string
    - objectName: content-understanding-endpoint
      key: content-understanding-endpoint
