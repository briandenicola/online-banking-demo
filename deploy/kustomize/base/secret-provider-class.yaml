apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: banking-secrets-provider
  namespace: banking-demo
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMkubeletIdentity: "false"
    keyvaultName: "modesthippo861kv"
    tenantId: "16b3c013-d300-468d-ac64-7eda0820b6d3"
    clientID: "0a606c77-03f3-4e4c-9cc7-4d51b86c09ff"
    objects: |
      array:
        - |
          objectName: jwt-key
          objectType: secret
        - |
          objectName: openai-endpoint
          objectType: secret
        - |
          objectName: redis-connection-string
          objectType: secret
        - |
          objectName: appinsights-connection-string
          objectType: secret
        - |
          objectName: content-understanding-endpoint
          objectType: secret
  secretObjects:
  - secretName: banking-secrets
    type: Opaque
    data:
    - objectName: jwt-key
      key: jwt-key
    - objectName: openai-endpoint
      key: openai-endpoint
    - objectName: redis-connection-string
      key: redis-connection-string
    - objectName: appinsights-connection-string
      key: appinsights-connection-string
    - objectName: content-understanding-endpoint
      key: content-understanding-endpoint
