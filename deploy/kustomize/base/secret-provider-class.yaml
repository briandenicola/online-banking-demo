apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: banking-secrets-provider
  namespace: banking-demo
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMkubeletIdentity: "false"
    keyvaultName: "REPLACE_WITH_KEYVAULT_NAME"
    tenantId: "REPLACE_WITH_TENANT_ID"
    clientID: "REPLACE_WITH_AZURE_CLIENT_ID"
    objects: |
      array:
        # The platform's ONLY private signing key. Mounted into user-service alone; every
        # other service fetches the public half from its JWKS endpoint (issue #334).
        - |
          objectName: jwt-private-key
          objectType: secret
        - |
          objectName: mediator-client-secret-authority
          objectType: secret
        - |
          objectName: openai-endpoint
          objectType: secret
        - |
          objectName: redis-connection-string
          objectType: secret
        - |
          objectName: appinsights-connection-string
          objectType: secret
        - |
          objectName: content-understanding-endpoint
          objectType: secret
  secretObjects:
  - secretName: banking-secrets
    type: Opaque
    data:
    - objectName: jwt-private-key
      key: jwt-private-key
    - objectName: mediator-client-secret-authority
      key: mediator-client-secret-authority
    - objectName: openai-endpoint
      key: openai-endpoint
    - objectName: redis-connection-string
      key: redis-connection-string
    - objectName: appinsights-connection-string
      key: appinsights-connection-string
    - objectName: content-understanding-endpoint
      key: content-understanding-endpoint
---
# WHY THERE ARE THREE OF THESE, NOT ONE
#
# The CSI driver exchanges the POD's service-account token for a token for the
# clientID named in the SecretProviderClass it mounts. So the identity in this
# object and the identity on the pod's ServiceAccount must be the SAME identity
# — the SPC does not inherit the pod's identity, it overrides it.
#
# authority-service and banker-copilot-service run under their own dedicated
# UAMIs (#336). Pointing them at the shared provider above made the driver
# present their SA tokens against the shared identity's federated credential,
# which is bound to `banking-workload-identity`. The assertion is refused and
# the pods never leave Init:
#
#   failed to mount objects ... ClientAssertionCredential authentication failed
#
# The tempting shortcut — add federated credentials for these two SAs onto the
# shared identity — is rejected on security grounds: it would let either pod
# obtain the SHARED identity's token, re-merging exactly what #336 split apart
# and handing the harness an identity with a far wider blast radius than its own.
#
# Each provider therefore names its own clientID and mounts ONLY the secrets that
# service actually needs. Both dedicated UAMIs already hold Key Vault Secrets
# User (infra/cloud/identity-authority.tf, identity-copilot.tf), so this is
# manifest-only — no new Azure grants.
#
# Each also syncs to its OWN Kubernetes Secret. Three SPCs writing one shared
# secretName would have them fighting over ownership of the same object.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: authority-secrets-provider
  namespace: banking-demo
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMkubeletIdentity: "false"
    keyvaultName: "REPLACE_WITH_KEYVAULT_NAME"
    tenantId: "REPLACE_WITH_TENANT_ID"
    clientID: "REPLACE_WITH_AUTHORITY_CLIENT_ID"
    objects: |
      array:
        # The approval signing key. DELIBERATELY not the JWT key: authority-service
        # refuses to start if the two are equal, because a bearer token must never
        # be able to forge an approval signature. Note this key is absent from the
        # shared provider above — no other workload has any business holding it.
        - |
          objectName: authority-signing-key
          objectType: secret
        - |
          objectName: mediator-client-secret-authority
          objectType: secret
        - |
          objectName: redis-connection-string
          objectType: secret
        - |
          objectName: appinsights-connection-string
          objectType: secret
  secretObjects:
  - secretName: authority-secrets
    type: Opaque
    data:
    - objectName: authority-signing-key
      key: authority-signing-key
    - objectName: mediator-client-secret-authority
      key: mediator-client-secret-authority
    - objectName: redis-connection-string
      key: redis-connection-string
    - objectName: appinsights-connection-string
      key: appinsights-connection-string
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: copilot-secrets-provider
  namespace: banking-demo
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMkubeletIdentity: "false"
    keyvaultName: "REPLACE_WITH_KEYVAULT_NAME"
    tenantId: "REPLACE_WITH_TENANT_ID"
    clientID: "REPLACE_WITH_COPILOT_CLIENT_ID"
    objects: |
      array:
        # Two secrets, and no more. The harness gets a model endpoint and a
        # telemetry string; it holds NO signing key and NO mediator credential,
        # so possessing this mount confers no ability to author or sign a write.
        # That is the two-service split expressed in the secret surface rather
        # than only in the code.
        - |
          objectName: openai-endpoint
          objectType: secret
        - |
          objectName: appinsights-connection-string
          objectType: secret
  secretObjects:
  - secretName: copilot-secrets
    type: Opaque
    data:
    - objectName: openai-endpoint
      key: openai-endpoint
    - objectName: appinsights-connection-string
      key: appinsights-connection-string
