            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: banking-demo
spec:
  selector:
    app: user-service
  ports:
  - port: 80
    targetPort: 6001
---
apiVersion: v1
kind: Service
metadata:
  name: account-service
  namespace: banking-demo
spec:
  selector:
    app: account-service
  ports:
  - port: 80
    targetPort: 6002
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service
  namespace: banking-demo
spec:
  selector:
    app: transaction-service
  ports:
  - port: 80
    targetPort: 6003
---
apiVersion: v1
kind: Service
metadata:
  name: transfer-service
  namespace: banking-demo
spec:
  selector:
    app: transfer-service
  ports:
  - port: 80
    targetPort: 6004
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot-service
  namespace: banking-demo
spec:
  selector:
    app: chatbot-service
  ports:
  - port: 80
    targetPort: 8001
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banking-demo-ingress
  namespace: banking-demo
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: banking-demo.local
    http:
      paths:
      - path: /api/users
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 80
      - path: /api/accounts
        pathType: Prefix
        backend:
          service:
            name: account-service
            port:
              number: 80
      - path: /api/transactions
        pathType: Prefix
        backend:
          service:
            name: transaction-service
            port:
              number: 80
      - path: /api/transfers
        pathType: Prefix
        backend:
          service:
            name: transfer-service
            port:
              number: 80
      - path: /api/chat
        pathType: Prefix
        backend:
          service:
            name: chatbot-service
            port:
              number: 80