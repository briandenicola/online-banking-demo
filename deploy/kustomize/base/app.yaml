  namespace: banking-demo
  labels:
    app: event-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-processor
  template:
    metadata:
      labels:
        app: event-processor
    spec:
      containers:
      - name: event-processor
        image: ghcr.io/banking-demo/event-processor:latest
        ports:
        - containerPort: 9001
        env:
        - name: EVENTHUB_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: banking-secrets
              key: eventhub-connection-string
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
