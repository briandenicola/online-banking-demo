apiVersion: apps/v1
kind: Deployment
metadata:
  name: budget-service
  namespace: banking-demo
  labels:
    app: budget-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: budget-service
  template:
    metadata:
      labels:
        app: budget-service
    spec:
      containers:
      - name: budget-service
        image: ghcr.io/banking-demo/budget-service:latest
