apiVersion: v1
kind: Namespace
metadata:
  name: banking-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: banking-demo-config
  namespace: flux-system
data:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/banking-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: banking-demo
  labels:
    app: user-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: ghcr.io/banking-demo/user-service:latest
        ports:
        - containerPort: 6001
        env:
        - name: CosmosDb__ConnectionString
          valueFrom:
            secretKeyRef:
              name: banking-secrets
              key: cosmos-connection-string
        - name: APPLICATIONINSIGHTS_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: banking-secrets
              key: appinsights-connection-string
        - name: Jwt__Key
          valueFrom:
            secretKeyRef:
              name: banking-secrets
              key: jwt-key
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: banking-demo
  labels:
    app: account-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
    spec:
      containers:
      - name: account-service
        image: ghcr.io/banking-demo/account-service:latest
        ports:
        - containerPort: 6002
        env:
        - name: CosmosDb__ConnectionString
          valueFrom:
            secretKeyRef:
              name: banking-secrets
              key: cosmos-connection-string
        - name: APPLICATIONINSIGHTS_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: banking-secrets
              key: appinsights-connection-string
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  namespace: banking-demo
  labels:
    app: transaction-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transaction-service
  template:
    metadata:
      labels:
        app: transaction-service
    spec:
      containers:
      - name: transaction-service
        image: ghcr.io/banking-demo/transaction-service:latest
        ports:
        - containerPort: 6003
        env:
        - name: CosmosDb__ConnectionString
          valueFrom:
            secretKeyRef:
              name: banking-secrets
              key: cosmos-connection-string
        - name: APPLICATIONINSIGHTS_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: banking-secrets
              key: appinsights-connection-string
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transfer-service
  namespace: banking-demo
  labels:
    app: transfer-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transfer-service
  template:
    metadata:
      labels:
        app: transfer-service
    spec:
      containers:
      - name: transfer-service
        image: ghcr.io/banking-demo/transfer-service:latest
