apiVersion: apps/v1
kind: Deployment
metadata:
  name: banker-copilot-service
  namespace: banking-demo
  labels:
    app: banker-copilot-service
    app.kubernetes.io/part-of: banking-demo
spec:
  # Single replica in Phase 2, and not only for cost. The SSE resume window is
  # served from copilot-traces, but an in-flight run's planner state is in
  # process memory; a second replica would answer a reconnect with a stream it
  # knows nothing about. Phase 3 fan-out is where this gets revisited.
  replicas: 1
  selector:
    matchLabels:
      app: banker-copilot-service
  template:
    metadata:
      annotations:
        traffic.sidecar.istio.io/excludeOutboundPorts: "10000"
      labels:
        app: banker-copilot-service
        azure.workload.identity/use: "true"
    spec:
      # Dedicated identity (#336) — NOT banking-workload-identity and NOT
      # authority-workload-identity. See infra/cloud/identity-copilot.tf: this
      # identity holds Cosmos WRITE on the three harness containers, Cosmos READ
      # ONLY on copilot-approvals, and no data-plane role at all on Accounts,
      # Transactions, Transfers, Users or authority-policy.
      #
      # That is the epic §2.1 service split expressed where it cannot be
      # refactored away: "the harness registers zero write tools" is a property
      # of Python source, but "the harness cannot write an approval" is a
      # property of an Entra role assignment. If a future change re-introduced a
      # write tool by accident, this identity still returns 403.
      serviceAccountName: banker-copilot-workload-identity
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: banker-copilot-service
        image: ghcr.io/banking-demo/banker-copilot-service:1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8005
          protocol: TCP
        env:
        - name: APPLICATIONINSIGHTS_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: copilot-secrets
              key: appinsights-connection-string
        # (JWT verification is configured in one block below: JWT_JWKS_URI,
        # JWT_AUDIENCE, JWT_ISSUER. This slot used to redeclare JWT_ISSUER, which
        # `kubectl apply` warns "may be dropped" — harmless while both copies said
        # user-service, and a silent divergence the first time one was edited.)
        # Model access for the planner loop, on the repo-wide FOUNDRY_* names that
        # ai-service and prompt-eval-service already use. This manifest previously
        # set AZURE_AI_PROJECT_ENDPOINT / AZURE_AI_MODEL_DEPLOYMENT — the names the
        # code shipped with — and the service reported the divergence through
        # `legacyConfigNames` on /readyz. It is reported there no longer.
        - name: FOUNDRY_PROJECT_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: copilot-secrets
              key: openai-endpoint
        - name: FOUNDRY_MODEL
          value: "gpt-5.4-mini"
        # Declared, not inferred. `planner_mode()` used to return "deterministic"
        # whenever the model configuration was incomplete, so a deployment that had
        # lost its model access still reported `status: ready` and answered with no
        # model behind it — and a reviewer measuring supervisor disagreement would
        # have been reading a canned script as agreement. Asking for foundry here
        # means the pod fails to start rather than quietly degrading.
        - name: COPILOT_PLANNER_MODE
          value: "foundry"
        # The supervisor's second opinion, for the same reason and with the same
        # consequence. The scripted decider recommends `proceed` whenever its own reads
        # succeed, and the primary proposed the action — so a pod that quietly ran the
        # script would show 100% agreement and render it as an independent co-signature.
        - name: COPILOT_SUPERVISOR_MODE
          value: "foundry"
        - name: COSMOS_DB_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: banking-demo-config
              key: COSMOS_DB_ENDPOINT
        # Fail-closed tool manifest. Baked into the image so the container is
        # self-consistent in docker-compose and CI; repoint this at a ConfigMap
        # mount to change the tool surface without a rebuild. The loader refuses
        # to start on a missing or invalid manifest — a harness that cannot
        # prove which tools it registered must not register any.
        - name: COPILOT_TOOL_MANIFEST_PATH
          value: "/app/config/copilot-tools.yaml"
        # Fan-out concurrency limits (epic §6.3). Baked into the image like the tool manifest;
        # repoint at a ConfigMap mount to re-tune fan-out without a rebuild. The engine
        # fail-closes if the file is missing or invalid.
        - name: COPILOT_HARNESS_LIMITS_PATH
          value: "/app/config/harness-limits.yaml"
        # Model-facing action descriptions. Baked in like the manifest; the loader refuses
        # to start without it, because names-only degradation is invisible from outside —
        # it surfaces as the model telling a banker the bank cannot act.
        - name: COPILOT_ACTION_METADATA_PATH
          value: "/app/config/copilot-actions.yaml"
        # Loaded and validated at startup either way; this controls only whether the
        # descriptions reach the model. Off pending Danny's wire ruling; the measurement
        # against the real demo prompt favours ON — see app/config.py.
        - name: COPILOT_ACTION_METADATA_ENABLED
          value: "0"
        # The SHARED role model, not the copy baked into this image.
        # Identical treatment to authority-service and user-service: one
        # ConfigMap object mounted into every pod that derives banking authority
        # from it. Three images built at three different commits cannot disagree
        # about who outranks whom if they are all reading the same object, and a
        # disagreement in this file is a privilege-escalation bug that no single
        # service can detect on its own.
        - name: ROLE_HIERARCHY_PATH
          value: "/app/shared-config/role-hierarchy.yaml"
        - name: JWT_JWKS_URI
          value: "http://user-service/.well-known/jwks.json"
        - name: JWT_AUDIENCE
          value: "banking-demo/copilot"
        - name: JWT_ISSUER
          value: "user-service"
        envFrom:
        - configMapRef:
            name: banking-demo-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8005
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          # /readyz reports the loaded tool manifest and whether any write tool
          # was registered. A pod that somehow came up with a write affordance
          # is visible here rather than discovered during a demo.
          httpGet:
            path: /readyz
            port: 8005
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: secrets-store
          mountPath: "/mnt/secrets-store"
          readOnly: true
        # Directory mount at a path of its own — not subPath, and not over
        # /app/config, which would hide the baked copilot-tools.yaml. A directory
        # mount also observes in-place ConfigMap updates, so the role model can
        # be corrected without a rollout.
        - name: role-hierarchy
          mountPath: "/app/shared-config"
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
      volumes:
      # Created from src/user-service/config/role-hierarchy.yaml by
      # tasks/Taskfile.cloud.yml (_configmap:apply) and mounted identically into
      # user-service and authority-service. optional: true so a missing
      # ConfigMap is an application-level failure with a log line rather than a
      # pod wedged in ContainerCreating with no signal.
      - name: role-hierarchy
        configMap:
          name: role-hierarchy
          optional: true
      - name: secrets-store
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: copilot-secrets-provider
---
apiVersion: v1
kind: Service
metadata:
  name: banker-copilot-service
  namespace: banking-demo
  labels:
    app: banker-copilot-service
spec:
  type: ClusterIP
  selector:
    app: banker-copilot-service
  ports:
  - port: 80
    targetPort: 8005
    protocol: TCP
