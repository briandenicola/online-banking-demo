apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-opening-service
  namespace: banking-demo
  labels:
    app: account-opening-service
    app.kubernetes.io/part-of: banking-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-opening-service
  template:
    metadata:
      annotations:
        traffic.sidecar.istio.io/excludeOutboundPorts: "10000"
      labels:
        app: account-opening-service
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: banking-workload-identity
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: account-opening-service
        image: ghcr.io/banking-demo/account-opening-service:1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8004
          protocol: TCP
        env:
        - name: APPLICATIONINSIGHTS_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: banking-secrets
              key: appinsights-connection-string
        - name: REDIS_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: banking-secrets
              key: redis-connection-string
        - name: FOUNDRY_PROJECT_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: banking-secrets
              key: openai-endpoint
        - name: FOUNDRY_MODEL
          value: "gpt-5.4-mini"
        - name: CUS_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: banking-secrets
              key: content-understanding-endpoint
        - name: JWT_ISSUER
          value: "user-service"
        - name: COSMOS_DB_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: banking-demo-config
              key: COSMOS_DB_ENDPOINT
        - name: JWT_JWKS_URI
          value: "http://user-service:8080/.well-known/jwks.json"
        - name: JWT_AUDIENCE
          value: "banking-demo/account-opening"
        - name: JWT_ADDITIONAL_AUDIENCES
          value: "banking-demo/mediator"
        - name: JWT_ISSUER
          value: "user-service"
        envFrom:
        - configMapRef:
            name: banking-demo-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8004
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8004
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: secrets-store
          mountPath: "/mnt/secrets-store"
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
      volumes:
      - name: secrets-store
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: banking-secrets-provider
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-opening-worker
  namespace: banking-demo
  labels:
    app: account-opening-worker
    app.kubernetes.io/part-of: banking-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-opening-worker
