---
apiVersion: v1
kind: Service
metadata:
  name: account-opening-service
  namespace: banking-demo
  labels:
    app: account-opening-service
spec:
  type: ClusterIP
  selector:
    app: account-opening-service
  ports:
  - port: 80
    targetPort: 8004
    protocol: TCP
