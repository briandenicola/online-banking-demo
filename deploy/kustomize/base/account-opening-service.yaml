      serviceAccountName: banking-workload-identity
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
      - name: provision-agents
        image: ghcr.io/banking-demo/account-opening-service:1.0.0
        imagePullPolicy: Always
        command: ["python", "-m", "app.agents.init_agents"]
        env:
        - name: FOUNDRY_PROJECT_ENDPOINT
