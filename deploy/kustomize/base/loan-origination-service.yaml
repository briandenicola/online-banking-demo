apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-origination-service
  namespace: banking-demo
  labels:
    app: loan-origination-service
    app.kubernetes.io/part-of: banking-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loan-origination-service
  template:
    metadata:
      labels:
        app: loan-origination-service
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: banking-workload-identity
      securityContext:
        runAsNonRoot: true
        runAsUser: 64198
        runAsGroup: 64198
        fsGroup: 64198
      containers:
      - name: loan-origination-service
        image: ghcr.io/banking-demo/loan-origination-service:1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          protocol: TCP
        env:
        - name: APPLICATIONINSIGHTS_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: banking-secrets
              key: appinsights-connection-string
        - name: Jwt__Key
          valueFrom:
            secretKeyRef:
              name: banking-secrets
              key: jwt-key
        envFrom:
        - configMapRef:
            name: banking-demo-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: secrets-store
          mountPath: "/mnt/secrets-store"
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
      volumes:
      - name: secrets-store
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: banking-secrets-provider
---
apiVersion: v1
kind: Service
metadata:
  name: loan-origination-service
  namespace: banking-demo
  labels:
    app: loan-origination-service
spec:
  type: ClusterIP
  selector:
    app: loan-origination-service
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
