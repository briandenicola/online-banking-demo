apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-app
  namespace: banking-demo
  labels:
    app: ui-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui-app
  template:
    metadata:
      labels:
        app: ui-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
      - name: ui-app
        image: ghcr.io/banking-demo/ui-app:1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
        volumeMounts:
        # Deployment-level feature-flag defaults (layer 3 of the resolver in
        # src/ui-app/src/config/featureFlags.ts). Mounted OVER the template the
        # image already carries, so flags can be changed without rebuilding.
        #
        # This is not a startup dependency: the image ships a working
        # runtime-config.js and the resolver has code defaults beneath it, so
        # removing this mount degrades to the built-in defaults rather than
        # breaking the app. The ConfigMap is generated by kustomize from
        # runtime-config.js in this directory and is therefore always applied
        # alongside this Deployment.
        #
        # subPath is required so the mount replaces one file instead of hiding
        # the entire built SPA under /usr/share/nginx/html. The cost of subPath
        # is that it never picks up ConfigMap updates in place — which is why
        # the generator's name hash (and the pod roll it triggers) is left on.
        - name: runtime-config
          mountPath: /usr/share/nginx/html/runtime-config.js
          subPath: runtime-config.js
          readOnly: true
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: runtime-config
        configMap:
          name: ui-app-runtime-config
---
apiVersion: v1
kind: Service
metadata:
  name: ui-app
  namespace: banking-demo
  labels:
    app: ui-app
spec:
  type: ClusterIP
  selector:
    app: ui-app
  ports:
  - port: 80
    targetPort: 8080
