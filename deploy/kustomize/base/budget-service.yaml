apiVersion: apps/v1
kind: Deployment
metadata:
  name: budget-service
  namespace: banking-demo
  labels:
    app: budget-service
    app.kubernetes.io/part-of: banking-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: budget-service
  template:
    metadata:
      labels:
        app: budget-service
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: ai-workload-identity
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: budget-service
        image: ghcr.io/banking-demo/budget-service:1.0.0
        ports:
        - containerPort: 8003
          protocol: TCP
        env:
        envFrom:
        - configMapRef:
            name: banking-demo-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8003
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8003
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
---
apiVersion: v1
kind: Service
metadata:
  name: budget-service
  namespace: banking-demo
  labels:
    app: budget-service
spec:
  type: ClusterIP
  selector:
    app: budget-service
  ports:
  - port: 80
    targetPort: 8003
    protocol: TCP
