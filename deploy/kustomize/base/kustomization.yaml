apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: banking-demo



resources:
- namespace.yaml
- configmap.yaml
- secret-provider-class.yaml
- user-service.yaml
- account-service.yaml
- transaction-service.yaml
- transfer-service.yaml
- ai-service.yaml
- account-opening-service.yaml
- budget-service.yaml
- chatbot-service.yaml
- event-processor.yaml
- ui-app.yaml
- prompt-eval-service.yaml
- authority-service.yaml

# ui-app deployment-level feature-flag defaults. Generated from the single copy
# of runtime-config.js that lives in this directory and is bind-mounted by
# docker-compose from the same path — one file, two mount mechanisms.
#
# The name-suffix hash is deliberately left ON: ui-app mounts this with subPath,
# and subPath mounts never observe in-place ConfigMap updates. The hash makes a
# content change produce a new ConfigMap name, which rolls the pod, which is the
# only way the new flag defaults actually reach a browser.
configMapGenerator:
- name: ui-app-runtime-config
  files:
  - runtime-config.js

images:
- name: ghcr.io/banking-demo/authority-service
  newName: REPLACE_WITH_ACR_LOGIN_SERVER/authority-service
  newTag: REPLACE_WITH_TAG
- name: ghcr.io/banking-demo/account-opening-service
  newName: REPLACE_WITH_ACR_LOGIN_SERVER/account-opening-service
  newTag: REPLACE_WITH_TAG
- name: ghcr.io/banking-demo/account-service
  newName: REPLACE_WITH_ACR_LOGIN_SERVER/account-service
  newTag: REPLACE_WITH_TAG
- name: ghcr.io/banking-demo/ai-service
  newName: REPLACE_WITH_ACR_LOGIN_SERVER/ai-service
  newTag: REPLACE_WITH_TAG
- name: ghcr.io/banking-demo/budget-service
  newName: REPLACE_WITH_ACR_LOGIN_SERVER/budget-service
  newTag: REPLACE_WITH_TAG
- name: ghcr.io/banking-demo/chatbot-service
  newName: REPLACE_WITH_ACR_LOGIN_SERVER/chatbot-service
  newTag: REPLACE_WITH_TAG
- name: ghcr.io/banking-demo/event-processor
  newName: REPLACE_WITH_ACR_LOGIN_SERVER/event-processor
  newTag: REPLACE_WITH_TAG
- name: ghcr.io/banking-demo/prompt-eval-service
  newName: REPLACE_WITH_ACR_LOGIN_SERVER/prompt-eval-service
  newTag: REPLACE_WITH_TAG
- name: ghcr.io/banking-demo/transaction-service
  newName: REPLACE_WITH_ACR_LOGIN_SERVER/transaction-service
  newTag: REPLACE_WITH_TAG
- name: ghcr.io/banking-demo/transfer-service
  newName: REPLACE_WITH_ACR_LOGIN_SERVER/transfer-service
  newTag: REPLACE_WITH_TAG
- name: ghcr.io/banking-demo/ui-app
