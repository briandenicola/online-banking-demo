apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: banking-demo
  labels:
    app: ai-service
    app.kubernetes.io/part-of: banking-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: banking-workload-identity
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: ai-service
        image: ghcr.io/banking-demo/ai-service:1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8002
          protocol: TCP
        env:
        - name: APPLICATIONINSIGHTS_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: banking-secrets
              key: appinsights-connection-string
        - name: REDIS__CONNECTIONSTRING
          valueFrom:
            secretKeyRef:
              name: banking-secrets
              key: redis-connection-string
        - name: FOUNDRY_PROJECT_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: banking-secrets
              key: openai-endpoint
        - name: FOUNDRY_MODEL
          value: "gpt-5.4-mini"
        envFrom:
        - configMapRef:
            name: banking-demo-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8002
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8002
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: banking-demo
  labels:
    app: ai-service
spec:
  type: ClusterIP
  selector:
    app: ai-service
  ports:
  - port: 80
    targetPort: 8002
    protocol: TCP
