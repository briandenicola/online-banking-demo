apiVersion: v1
kind: ConfigMap
metadata:
  name: banking-demo-config
  namespace: banking-demo
data:
  USER_SERVICE_URL: "http://user-service.banking-demo.svc.cluster.local"
  ACCOUNT_SERVICE_URL: "http://account-service.banking-demo.svc.cluster.local"
  TRANSACTION_SERVICE_URL: "http://transaction-service.banking-demo.svc.cluster.local"
  TRANSFER_SERVICE_URL: "http://transfer-service.banking-demo.svc.cluster.local"
  ANOMALY_SERVICE_URL: "http://ai-service.banking-demo.svc.cluster.local"
  BUDGET_SERVICE_URL: "http://budget-service.banking-demo.svc.cluster.local"
  CHATBOT_SERVICE_URL: "http://chatbot-service.banking-demo.svc.cluster.local"
  EVENT_PROCESSOR_URL: "http://event-processor.banking-demo.svc.cluster.local"
  Services__AccountService: "http://account-service.banking-demo.svc.cluster.local"
  Services__TransactionService: "http://transaction-service.banking-demo.svc.cluster.local"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4317"
  CosmosDb__Endpoint: "REPLACE_WITH_COSMOS_ENDPOINT"
  CosmosDb__AccountsContainerName: "Accounts"
  COSMOS_DB_ENDPOINT: "REPLACE_WITH_COSMOS_ENDPOINT"
  CHAT_MEMORY_ENABLED: "REPLACE_WITH_CHAT_MEMORY_ENABLED"
  CHAT_MEMORY_REQUIRED: "false"
  CHAT_MEMORY_DATABASE: "BankingDemo"
  CHAT_MEMORY_CONTAINER: "AgentMemories"
  CHAT_MEMORY_TURNS_CONTAINER: "AgentMemoryTurns"
  CHAT_MEMORY_SUMMARIES_CONTAINER: "AgentMemorySummaries"
  CHAT_MEMORY_COUNTER_CONTAINER: "AgentMemoryCounters"
  CHAT_MEMORY_LEASE_CONTAINER: "AgentMemoryLeases"
  CHAT_MEMORY_MAX_CONTEXT_TURNS: "8"
  CHAT_MEMORY_MAX_FACTS: "5"
  CHAT_MEMORY_MAX_PROMPT_CHARS: "4000"
  CHAT_MEMORY_MIN_CONFIDENCE: "0.7"
  CHAT_MEMORY_PROCESS_EVERY_N_TURNS: "2"
  CHAT_MEMORY_RECONCILE_EVERY_N_TURNS: "8"
  CHAT_MEMORY_EMBEDDING_DEPLOYMENT: "REPLACE_WITH_CHAT_MEMORY_EMBEDDING_DEPLOYMENT"
  AZURE_STORAGE_ACCOUNT_NAME: "REPLACE_WITH_STORAGE_ACCOUNT"
  AGENT_ID_AGENT_IDENTITY: "REPLACE_WITH_AZURE_CLIENT_ID"
  AzureAd__TenantId: "REPLACE_WITH_TENANT_ID"
  AzureAd__ClientId: "REPLACE_WITH_AZURE_CLIENT_ID"
  AzureAd__ClientCredentials__0__SourceType: "SignedAssertionFilePath"
  Kestrel__Endpoints__Http__Url: "http://[::]:8080"
