apiVersion: v1
kind: ConfigMap
metadata:
  name: banking-demo-config
  namespace: banking-demo
data:
  USER_SERVICE_URL: "http://user-service.banking-demo.svc.cluster.local"
  ACCOUNT_SERVICE_URL: "http://account-service.banking-demo.svc.cluster.local"
  TRANSACTION_SERVICE_URL: "http://transaction-service.banking-demo.svc.cluster.local"
  TRANSFER_SERVICE_URL: "http://transfer-service.banking-demo.svc.cluster.local"
  ANOMALY_SERVICE_URL: "http://ai-service.banking-demo.svc.cluster.local"
  BUDGET_SERVICE_URL: "http://budget-service.banking-demo.svc.cluster.local"
  CHATBOT_SERVICE_URL: "http://chatbot-service.banking-demo.svc.cluster.local"
  EVENT_PROCESSOR_URL: "http://event-processor.banking-demo.svc.cluster.local"
  AUTHORITY_SERVICE_URL: "http://authority-service.banking-demo.svc.cluster.local"
  Services__AccountService: "http://account-service.banking-demo.svc.cluster.local"
  Services__TransactionService: "http://transaction-service.banking-demo.svc.cluster.local"
  Services__AuthorityService: "http://authority-service.banking-demo.svc.cluster.local"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4317"
  CosmosDb__Endpoint: "REPLACE_WITH_COSMOS_ENDPOINT"
  CosmosDb__AccountsContainerName: "Accounts"
  # Banker Copilot authority store (epic #332). Container names are configuration,
  # never literals in service code — authority-service and banker-copilot-service
  # must agree on them and they are also referenced by the scoped Cosmos role
  # assignments in infra/cloud/identity-authority.tf.
  CosmosDb__ApprovalsContainerName: "copilot-approvals"
  CosmosDb__AuthorityPolicyContainerName: "authority-policy"
  # Banker Copilot harness stores (epic #332 Phase 2). banker-copilot-service is
  # Python and reads SCREAMING_SNAKE, matching every other Python service here;
  # authority-service is .NET and reads the CosmosDb__* form above. Those are two
  # different containers each named once, NOT one container named twice.
  #
  # Each name below is also the `scope` of a Cosmos role assignment in
  # infra/cloud/identity-copilot.tf. If a name here and a name there ever drift,
  # the service does not fail — Cosmos returns 403 on a container it can see but
  # was not granted, or silently reads an empty container it created by accident.
  # Terraform emits `copilot_container_names` so a deploy can source them from
  # state instead of from this list.
  COSMOS_DB_DATABASE: "BankingDemo"
  COPILOT_SESSIONS_CONTAINER: "copilot-sessions"
  COPILOT_ARTIFACTS_CONTAINER: "copilot-artifacts"
  COPILOT_TRACES_CONTAINER: "copilot-traces"
  # Harness runtime bounds. Configuration, never literals in service code.
  # COPILOT_SESSION_TTL_SECONDS is an IDLE-STREAM timeout inside the service and
  # is unrelated to var.copilot_session_retention_seconds, which is the Cosmos
  # document TTL on copilot-sessions. Two different clocks, deliberately.
  COPILOT_SSE_HEARTBEAT_SECONDS: "15"
  COPILOT_SSE_REPLAY_WINDOW: "500"
  COPILOT_SESSION_TTL_SECONDS: "3600"
  COPILOT_PLANNER_MAX_ITERATIONS: "12"
  COPILOT_UPSTREAM_TIMEOUT_MS: "8000"
  # Read-tool upstreams (epic §3.3). The harness resolves a logical tool target
  # to a base URL through these; an unlisted service resolves to None and the
  # tool fails closed rather than defaulting to anything.
  #
  # UPPER_SNAKE after the `DOWNSTREAM__` prefix is MANDATORY here, not stylistic.
  # These reach the pod through `envFrom`, and Kubernetes only injects ConfigMap
  # keys that are valid C_IDENTIFIERs (`[A-Za-z_][A-Za-z0-9_]*`). A key like
  # `DOWNSTREAM__account-service` contains a hyphen, so it is silently SKIPPED —
  # and since kubernetes#130099 not even an event is emitted. The pod would come
  # up healthy with every read tool unresolvable. The service lowercases and maps
  # `_` back to `-` when it resolves a logical name, so this form and the compose
  # form denote the same six services.
  #
  # authority-service is deliberately NOT in this map. It is reached through
  # AUTHORITY_SERVICE_URL above and only by `propose_action` — keeping it out of
  # the generic downstream table means a mis-registered tool cannot acquire the
  # one endpoint that executes.
  DOWNSTREAM__ACCOUNT_SERVICE: "http://account-service.banking-demo.svc.cluster.local"
  DOWNSTREAM__TRANSACTION_SERVICE: "http://transaction-service.banking-demo.svc.cluster.local"
  DOWNSTREAM__TRANSFER_SERVICE: "http://transfer-service.banking-demo.svc.cluster.local"
  DOWNSTREAM__USER_SERVICE: "http://user-service.banking-demo.svc.cluster.local"
  DOWNSTREAM__ACCOUNT_OPENING_SERVICE: "http://account-opening-service.banking-demo.svc.cluster.local"
  DOWNSTREAM__AI_SERVICE: "http://ai-service.banking-demo.svc.cluster.local"
  # Bootstrap identities for the role ladder (§5.8.3). Seeding is idempotent and
  # is skipped once an identity already holds the role.
  Authority__BootstrapSupervisorEmail: "REPLACE_WITH_BOOTSTRAP_SUPERVISOR_EMAIL"
  Authority__BootstrapBankerEmail: "REPLACE_WITH_BOOTSTRAP_BANKER_EMAIL"
  # Denial reason quality gate (epic §5.5). Every bound is configuration: a deployment can
  # tighten or relax it without a code change, and authority-service has no fallback literals.
  Denial__ReasonMinLength: "20"
  Denial__ReasonMaxLength: "2000"
  Denial__ReasonMinDistinctChars: "5"
  Denial__ReasonMaxRepeatUnit: "8"
  Denial__ReasonMinLetters: "10"
  # Expiry sweeper. Expiry means denied with TTL_EXPIRED — never auto-approved.
  Approval__SweepIntervalSeconds: "60"
  Approval__SweepBatchSize: "100"
  Approval__RetentionSeconds: "7776000"
  # Out-of-band supervisor notification sinks (epic §5.6). SELECTION and endpoints are
  # configuration, never literals in authority-service. `Notifications__Sinks` chooses which
  # sinks run; the redis-stream sink publishes to a DEDICATED stream key, NOT the audited
  # banking-events bus, so a transient supervisor ping never pollutes the audit vocabulary
  # (see .squad/decisions/inbox/rusty-phase3-notification-sinks.md). The Redis CONNECTION
  # itself is a secret, wired in authority-service.yaml — these keys are non-secret selection.
  # To POST to Teams/Slack in a live demo, add `webhook` to Notifications__Sinks and set
  # Notifications__WebhookUrl. Nested .NET config keys use `__`, which is a valid ConfigMap
  # key (unlike a hyphen, which envFrom would silently drop).
  Notifications__Sinks: "redis-stream"
  Notifications__RedisStreamKey: "copilot-notifications"
  Notifications__WebhookUrl: ""
  Notifications__WebhookTimeoutSeconds: "5"
  Notifications__EmailTo: ""
  COSMOS_DB_ENDPOINT: "REPLACE_WITH_COSMOS_ENDPOINT"
  CHAT_MEMORY_ENABLED: "REPLACE_WITH_CHAT_MEMORY_ENABLED"
  CHAT_MEMORY_REQUIRED: "false"
  CHAT_MEMORY_DATABASE: "BankingDemo"
  CHAT_MEMORY_CONTAINER: "AgentMemories"
  CHAT_MEMORY_TURNS_CONTAINER: "AgentMemoryTurns"
  CHAT_MEMORY_SUMMARIES_CONTAINER: "AgentMemorySummaries"
  CHAT_MEMORY_COUNTER_CONTAINER: "AgentMemoryCounters"
  CHAT_MEMORY_LEASE_CONTAINER: "AgentMemoryLeases"
  CHAT_MEMORY_MAX_CONTEXT_TURNS: "8"
  CHAT_MEMORY_MAX_FACTS: "5"
  CHAT_MEMORY_MAX_PROMPT_CHARS: "4000"
  CHAT_MEMORY_MIN_CONFIDENCE: "0.7"
  CHAT_MEMORY_PROCESS_EVERY_N_TURNS: "2"
  CHAT_MEMORY_RECONCILE_EVERY_N_TURNS: "8"
  CHAT_MEMORY_EMBEDDING_DEPLOYMENT: "REPLACE_WITH_CHAT_MEMORY_EMBEDDING_DEPLOYMENT"
  AZURE_STORAGE_ACCOUNT_NAME: "REPLACE_WITH_STORAGE_ACCOUNT"
  AGENT_ID_AGENT_IDENTITY: "REPLACE_WITH_AZURE_CLIENT_ID"
  AzureAd__TenantId: "REPLACE_WITH_TENANT_ID"
  AzureAd__ClientId: "REPLACE_WITH_AZURE_CLIENT_ID"
  AzureAd__ClientCredentials__0__SourceType: "SignedAssertionFilePath"
  Kestrel__Endpoints__Http__Url: "http://[::]:8080"
