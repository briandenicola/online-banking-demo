apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-service
  namespace: banking-demo
  labels:
    app: chatbot-service
    app.kubernetes.io/part-of: banking-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot-service
  template:
    metadata:
      labels:
        app: chatbot-service
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: banking-workload-identity
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: chatbot-service
        image: ghcr.io/banking-demo/chatbot-service:1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
          protocol: TCP
        env:
        - name: FOUNDRY_PROJECT_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: banking-secrets
              key: openai-endpoint
        - name: FOUNDRY_MODEL
          value: "gpt-5.4-mini"
        - name: COSMOS_DB_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: banking-demo-config
              key: COSMOS_DB_ENDPOINT
        - name: JWT_JWKS_URI
          value: "http://user-service:8080/.well-known/jwks.json"
        - name: JWT_AUDIENCE
          value: "banking-demo/chatbot"
        - name: JWT_ISSUER
          value: "user-service"
        envFrom:
        - configMapRef:
            name: banking-demo-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: secrets-store
          mountPath: "/mnt/secrets-store"
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
      volumes:
      - name: secrets-store
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: banking-secrets-provider
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot-service
  namespace: banking-demo
  labels:
    app: chatbot-service
spec:
  type: ClusterIP
  selector:
    app: chatbot-service
  ports:
  - port: 80
    targetPort: 8001
    protocol: TCP
