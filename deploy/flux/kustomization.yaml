apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: banking-demo
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./deploy/kustomize
  prune: true
  sourceRef:
    kind: GitRepository
    name: banking-demo
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: banking-demo-config