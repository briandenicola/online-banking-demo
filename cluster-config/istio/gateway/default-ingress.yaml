---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: banking-demo-vs
  namespace: banking-demo
spec:
  hosts:
  - "*"
  gateways:
  - aks-istio-ingress/banking-demo-gateway
  http:
  # UI app (default catch-all at bottom)
  - match:
    - uri:
        prefix: /api/auth
    route:
    - destination:
        host: user-service
        port:
          number: 80
  - match:
    - uri:
        prefix: /api/users
    route:
    - destination:
        host: user-service
        port:
          number: 80
  - match:
    - uri:
        prefix: /api/accounts
    route:
    - destination:
        host: account-service
        port:
          number: 80
  - match:
    - uri:
        prefix: /api/transactions
    route:
    - destination:
        host: transaction-service
        port:
          number: 80
  - match:
    - uri:
        prefix: /api/transfers
    route:
    - destination:
        host: transfer-service
        port:
          number: 80
  - match:
    - uri:
        prefix: /api/chat
    route:
    - destination:
        host: chatbot-service
        port:
          number: 80
  - match:
    - uri:
        prefix: /api/anomaly
    route:
    - destination:
        host: ai-service
        port:
          number: 80
  - match:
    - uri:
        prefix: /api/budget
    route:
    - destination:
        host: budget-service
        port:
          number: 80
  - match:
    - uri:
        prefix: /api/evaluations
    route:
    - destination:
        host: prompt-eval-service
        port:
          number: 80
  # User-service admin routes (more specific, must come before generic /api/admin)
  - match:
    - uri:
        prefix: /api/admin/users
    route:
    - destination:
        host: user-service
        port:
          number: 80
  - match:
    - uri:
        prefix: /api/admin/login-audits
    route:
    - destination:
        host: user-service
        port:
          number: 80
  - match:
    - uri:
        prefix: /api/admin/promote
    route:
    - destination:
        host: user-service
        port:
          number: 80
  - match:
    - uri:
        prefix: /api/admin/replay-events
    route:
    - destination:
        host: transaction-service
        port:
          number: 80
  # AI-service admin routes (flagged-transactions, stats, scored-transactions)
  - match:
    - uri:
        prefix: /api/admin
    route:
    - destination:
        host: ai-service
        port:
          number: 80
  - match:
    - uri:
        prefix: /api/account-opening
    route:
    - destination:
        host: account-opening-service
        port:
          number: 80
  # Authority endpoints → authority-service (epic #332).
  # This is the ONLY component permitted to perform an agent-originated write.
  # Kept on its own /api/authority/ prefix, not folded under /api/copilot/, so
  # the enforcement boundary is legible in the URL and cannot be silently
  # re-routed to the harness by route ordering. Mirrors the nginx location in
  # infra/local/gateway.nginx.conf — the two gateways must agree, because a
  # prefix that exists in only one of them is a feature that works locally and
  # 404s in the cluster.
  - match:
    - uri:
        prefix: /api/authority/
    route:
    - destination:
        host: authority-service
        port:
          number: 80
  # Copilot harness endpoints → banker-copilot-service (epic #332).
  #
  # timeout: 0s is load-bearing, not tidying. This prefix carries the session
  # SSE trace stream (GET /api/copilot/sessions/{id}/stream), and Istio's
  # DEFAULT route timeout is 15s — an SSE connection is idle between frames by
  # design, so with the default every run's trace is severed mid-stream. Envoy
  # terminates it as a normal response end, which is byte-for-byte
  # indistinguishable from a clean end-of-stream: the browser sees a short but
  # successful trace, the client's reconnect logic never fires, and a dead
  # stream looks exactly like a working one. That is the failure
  # docs/design/banker-copilot-ui.md §4.6 exists to prevent.
  #
  # No buffering knob is needed here (nginx has proxy_buffering off): Envoy
  # streams responses and does not accumulate an unbounded body.
  - match:
    - uri:
        prefix: /api/copilot/
    route:
    - destination:
        host: banker-copilot-service
        port:
          number: 80
    timeout: 0s
  # Default: serve UI
  - route:
    - destination:
        host: ui-app
        port:
          number: 80
