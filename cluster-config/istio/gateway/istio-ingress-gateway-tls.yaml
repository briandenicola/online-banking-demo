apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: banking-demo-gateway
  namespace: aks-istio-ingress
spec:
  selector:
    istio: aks-istio-ingressgateway-external
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    tls:
      httpsRedirect: true
    hosts:
    - "${CUSTOM_DOMAIN}"
  - port:
      number: 443
      name: https
      protocol: HTTPS
    tls:
      mode: SIMPLE
      credentialName: banking-demo-tls
    hosts:
    - "${CUSTOM_DOMAIN}"
