name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - user-service
          - account-service
          - transaction-service
          - transfer-service
          - chatbot-service
          - anomaly-service
          - budget-service
          - event-processor

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push .NET services
      if: matrix.service != 'chatbot-service' && matrix.service != 'anomaly-service' && matrix.service != 'budget-service' && matrix.service != 'event-processor'
      uses: docker/build-push-action@v5
      with:
        context: ./src/${{ matrix.service }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Python services
      if: matrix.service == 'chatbot-service' || matrix.service == 'anomaly-service' || matrix.service == 'budget-service'
      uses: docker/build-push-action@v5
      with:
        context: ./src/${{ matrix.service }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Go service
      if: matrix.service == 'event-processor'
      uses: docker/build-push-action@v5
      with:
        context: ./src/${{ matrix.service }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore src/shared/Contracts/Contracts.csproj

    - name: Build
      run: dotnet build src/shared/Contracts/Contracts.csproj --no-restore

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        pip install poetry
        poetry install --directory src/chatbot-service

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'