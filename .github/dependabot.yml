version: 2
updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # .NET (NuGet) — each service
  - package-ecosystem: nuget
    directory: /src/user-service
    schedule:
      interval: weekly
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /src/account-service
    schedule:
      interval: weekly
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /src/transaction-service
    schedule:
      interval: weekly
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /src/transfer-service
    schedule:
      interval: weekly
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /src/prompt-eval-service
    schedule:
      interval: weekly
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  # authority-service — the sole executor of agent-originated writes (epic #332).
  # Absent until 2026-09-08, so the one service on the critical write path was
  # the one service receiving no dependency updates at all.
  - package-ecosystem: nuget
    directory: /src/authority-service
    schedule:
      interval: weekly
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  # Python (pip) — each service
  - package-ecosystem: pip
    directory: /src/ai-service
    schedule:
      interval: weekly
    groups:
      pip-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /src/budget-service
    schedule:
      interval: weekly
    groups:
      pip-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /src/chatbot-service
    schedule:
      interval: weekly
    groups:
      pip-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /src/account-opening-service
    schedule:
      interval: weekly
    groups:
      pip-minor-patch:
        update-types: [minor, patch]

  # banker-copilot-service — the agent loop (epic #332). Registers zero write
  # tools, but it is the component a prompt-injection payload reaches first, so
  # its dependency surface is security-relevant even though it cannot write.
  - package-ecosystem: pip
    directory: /src/banker-copilot-service
    schedule:
      interval: weekly
    groups:
      pip-minor-patch:
        update-types: [minor, patch]

  # Go modules
  - package-ecosystem: gomod
    directory: /src/event-processor
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  # npm (React UI)
  - package-ecosystem: npm
    directory: /src/ui-app
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # Docker
  - package-ecosystem: docker
    directory: /src/user-service
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/account-service
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/transaction-service
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/transfer-service
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/prompt-eval-service
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/ai-service
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/budget-service
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/chatbot-service
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/account-opening-service
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/event-processor
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/ui-app
    schedule:
      interval: weekly

  # Base-image updates for the two services added by epic #332.
  - package-ecosystem: docker
    directory: /src/authority-service
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/banker-copilot-service
    schedule:
      interval: weekly

  # Terraform
  - package-ecosystem: terraform
    directory: /infra/cloud
    schedule:
      interval: weekly
    groups:
      terraform-minor-patch:
        update-types: [minor, patch]
    # A provider MAJOR is not a dependency bump — it is a state migration.
    # The AzureRM v4→v5 PR (#340) would have landed a provider that the already
    # provisioned environment's state was not written by, so every subsequent
    # `terraform output` — which `task cloud:deploy` depends on for the ACR name,
    # the Cosmos endpoint and the workload-identity client ids — would have run
    # against a provider that may demand a state upgrade first. The grouping
    # above only groups minor/patch; ungrouped majors still arrive as their own
    # PR, so the group alone does NOT suppress them. This does.
    #
    # Deliberately NOT a blanket major ignore for the whole ecosystem: it names
    # the provider, so a major on some other terraform dependency still surfaces
    # and gets a decision rather than being silently swallowed.
    ignore:
      - dependency-name: hashicorp/azurerm
        update-types: [version-update:semver-major]
