version: '3'

# Demo dataset tasks (issue #356).
#
# Included TWICE — once under `local:` and once under `cloud:` — so the target is selected
# exactly the way the repo already distinguishes environments:
#
#     task local:demo:seed        task cloud:demo:seed
#     task local:demo:show        task cloud:demo:show
#     task local:demo:reset       task cloud:demo:reset
#
# A single top-level `demo:` namespace was the alternative. It was rejected because it would
# need its own flag to say which environment it meant, giving this repo two different ways to
# express "local or cloud" — and the one thing worse than a long task name is two spellings of
# the same distinction, only one of which is checked.
#
# DEMO_TARGET is supplied by the including Taskfile; nothing here knows a hostname or a port.

tasks:
  seed:
    desc: Seed the demo dataset — identities, accounts, scored transactions, approvals (idempotent)
    dir: '{{.ROOT_DIR}}'
    cmds:
      - chmod +x scripts/demo/demo.sh scripts/demo/demo-lib.sh
      - ./scripts/demo/demo.sh seed --target {{.DEMO_TARGET}} {{.CLI_ARGS}}

  show:
    desc: Report what the demo environment currently contains
    dir: '{{.ROOT_DIR}}'
    cmds:
      - chmod +x scripts/demo/demo.sh scripts/demo/demo-lib.sh
      - ./scripts/demo/demo.sh show --target {{.DEMO_TARGET}} {{.CLI_ARGS}}

  reset:
    desc: Close open approvals and remove the demo identities (add -- --reseed to seed again)
    dir: '{{.ROOT_DIR}}'
    cmds:
      - chmod +x scripts/demo/demo.sh scripts/demo/demo-lib.sh
      - ./scripts/demo/demo.sh reset --target {{.DEMO_TARGET}} {{.CLI_ARGS}}

  verify:
    desc: Static checks on the demo dataset and scripts — no environment required
    dir: '{{.ROOT_DIR}}'
    cmds:
      - chmod +x tests/demo/test-demo-dataset.sh
      - ./tests/demo/test-demo-dataset.sh
