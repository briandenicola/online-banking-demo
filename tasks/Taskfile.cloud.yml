version: '3'

env:
  INFRA_DIR: infra/cloud
  DEPLOY_EMBEDDING_MODEL: '{{default "true" .DEPLOY_EMBEDDING_MODEL}}'
  CHAT_MEMORY_ENABLED: '{{default "false" .CHAT_MEMORY_ENABLED}}'
  CHAT_MEMORY_EMBEDDING_DEPLOYMENT: '{{default "text-embedding-ada-002" .CHAT_MEMORY_EMBEDDING_DEPLOYMENT}}'

vars:
  ACR_NAME:
    sh: terraform -chdir=./{{.INFRA_DIR}} output -raw acr_name || true
  ACR_LOGIN_SERVER:
    sh: terraform -chdir=./{{.INFRA_DIR}} output -raw acr_login_server || true
  TAG: latest
  NAMESPACE: banking-demo

includes:
  build:
    taskfile: ./Taskfile.build.yml
    dir: '{{.ROOT_DIR}}'
    internal: false

  demo:
    taskfile: ./Taskfile.demo.yml
    dir: '{{.ROOT_DIR}}'
    internal: false
    vars:
      DEMO_TARGET: cloud

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  up:
    desc: Creates complete Azure environment for {{.TITLE}} (includes AI Foundry)
    cmds:
      - task: _init
      - task: apply
      - task: infra:config

  apply:
    desc: Apply Terraform infrastructure
    cmds:
      - terraform -chdir=./{{.INFRA_DIR}} apply -auto-approve -compact-warnings
        -var "region={{.REGION}}"
        -var "deploy_embedding_model={{.DEPLOY_EMBEDDING_MODEL}}"
    vars:
      REGION: '{{default .DEFAULT_REGION .CLI_ARGS}}'

  down:
    desc: Destroys all Azure resources and cleans up Terraform
    dir: '{{.INFRA_DIR}}'
    cmds:
      - az group list --tag Application="{{.TITLE}}" --query "[].name" -o tsv | xargs --no-run-if-empty -ot -n 1 az group delete -y --no-wait -n || true
      - rm -rf terraform.tfstate.d .terraform.lock.hcl .terraform terraform.tfstate terraform.tfstate.backup .terraform.tfstate.lock.info terraform.tfstate.* || true

  output-env:
    desc: Output environment variables for local AI development
    dir: '{{.INFRA_DIR}}'
    cmds:
      - |
        echo "# Azure AI Foundry Environment (RBAC auth)"
        echo "AZURE_OPENAI_ENDPOINT={{.AZURE_OPENAI_ENDPOINT}}"
        echo "AZURE_CLIENT_ID={{.AZURE_CLIENT_ID}}"
        echo "AZURE_OPENAI_MODEL={{.AZURE_OPENAI_MODEL}}"
        echo "AZURE_OPENAI_EMBEDDING_MODEL={{.AZURE_OPENAI_EMBEDDING_MODEL}}"
        echo "CHAT_MEMORY_ENABLED={{.CHAT_MEMORY_ENABLED}}"
        echo "CHAT_MEMORY_REQUIRED=false"
        echo "CHAT_MEMORY_DATABASE=BankingDemo"
        echo "CHAT_MEMORY_CONTAINER=AgentMemories"
        echo "CHAT_MEMORY_TURNS_CONTAINER=AgentMemoryTurns"
        echo "CHAT_MEMORY_SUMMARIES_CONTAINER=AgentMemorySummaries"
        echo "CHAT_MEMORY_COUNTER_CONTAINER=AgentMemoryCounters"
        echo "CHAT_MEMORY_LEASE_CONTAINER=AgentMemoryLeases"
        echo "CHAT_MEMORY_EMBEDDING_DEPLOYMENT={{.AZURE_OPENAI_EMBEDDING_MODEL}}"
        echo "APPLICATIONINSIGHTS_CONNECTION_STRING={{.APPLICATIONINSIGHTS_CONNECTION_STRING}}"
    silent: true
    vars:
      AZURE_OPENAI_MODEL: gpt-5.4-mini
      AZURE_OPENAI_EMBEDDING_MODEL: text-embedding-ada-002
      CHAT_MEMORY_ENABLED: '{{default "false" .CHAT_MEMORY_ENABLED}}'
      AZURE_OPENAI_ENDPOINT:
        sh: terraform -chdir=./{{.INFRA_DIR}} output -raw openai_endpoint
      AZURE_CLIENT_ID:
        sh: terraform -chdir=./{{.INFRA_DIR}} output -raw banking_services_client_id
      APPLICATIONINSIGHTS_CONNECTION_STRING:
        sh: terraform -chdir=./{{.INFRA_DIR}} output -raw application_insights_connection_string

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf src/**/bin src/**/obj
      - rm -rf node_modules dist

  deploy:
    desc: Deploy application to Kubernetes cluster (env values streamed in from terraform state — manifests on disk never mutated)
    cmds:
      - kubectl apply -k deploy/kustomize/observability/
      - task: _images:apply
      - task: _configmap:apply
      - task: _secretproviderclass:apply
      - kubectl apply -f cluster-config/istio/gateway/istio-ingress-gateway.yaml
      - kubectl apply -f cluster-config/istio/gateway/default-ingress.yaml
      - task: tls:enable
      # Force pods to re-pull :latest images. kustomize pins :latest, so when no
      # manifest field changes, `kubectl apply` is a no-op and pods keep running
      # the previously-pulled digest even though imagePullPolicy=Always — that
      # policy only fires on pod creation. Rollout restart guarantees fresh pulls.
      - kubectl rollout restart deployment -n {{.NAMESPACE}}

  memory:enable:
    desc: Enable chatbot Agent Memory Toolkit MVP and restart only chatbot-service
    cmds:
      - task: _configmap:apply
        vars:
          CHAT_MEMORY_ENABLED: "true"
      - kubectl rollout restart deployment/chatbot-service -n {{.NAMESPACE}}
      - kubectl rollout status deployment/chatbot-service -n {{.NAMESPACE}} --timeout=180s
      - task: memory:status

  memory:disable:
    desc: Disable chatbot Agent Memory Toolkit MVP and restart only chatbot-service
    cmds:
      - task: _configmap:apply
        vars:
          CHAT_MEMORY_ENABLED: "false"
      - kubectl rollout restart deployment/chatbot-service -n {{.NAMESPACE}}
      - kubectl rollout status deployment/chatbot-service -n {{.NAMESPACE}} --timeout=180s
      - task: memory:status

  memory:status:
    desc: Show chatbot memory ConfigMap values and recent chatbot logs
    cmds:
      - |
        kubectl get configmap banking-demo-config -n {{.NAMESPACE}} \
          -o jsonpath='{.data.CHAT_MEMORY_ENABLED}{"\n"}{.data.CHAT_MEMORY_REQUIRED}{"\n"}{.data.CHAT_MEMORY_EMBEDDING_DEPLOYMENT}{"\n"}{.data.CHAT_MEMORY_DATABASE}{"\n"}{.data.CHAT_MEMORY_CONTAINER}{"\n"}' \
          | awk 'NR==1{print "CHAT_MEMORY_ENABLED="$0} NR==2{print "CHAT_MEMORY_REQUIRED="$0} NR==3{print "CHAT_MEMORY_EMBEDDING_DEPLOYMENT="$0} NR==4{print "CHAT_MEMORY_DATABASE="$0} NR==5{print "CHAT_MEMORY_CONTAINER="$0}'
      - kubectl logs -n {{.NAMESPACE}} deployment/chatbot-service --tail=80 --since=10m | grep -Ei "memory|agent memory|cosmos|embedding" || true

  # === Logs ===
  #
  # The services log structlog JSON, one object per line. Raw `kubectl logs` is therefore
  # technically complete and practically unreadable — the line that matters is usually a
  # `level: warning` buried in a 200-line wall, and the field that explains it (an upstream
  # status code, a model error class) is at the far right of a 400-character line.
  #
  # These pretty-print through jq when it is present and fall back to raw output when it is
  # not, because a log task that fails on a machine without jq is a log task you cannot use
  # in the one situation you need it.
  #
  # DEFAULT SERVICE is banker-copilot-service: it is the one with a model behind it, so it is
  # the one whose failures are not self-evident. Override by passing the deployment name:
  #
  #     task cloud:logs                      # banker-copilot-service, last 15m
  #     task cloud:logs -- ai-service        # any other deployment
  #     task cloud:logs:follow               # stream it
  #     task cloud:logs:model                # model-call health only (see below)
  #
  # SINCE and TAIL are environment knobs, because `--` is consumed entirely by the service
  # name: `SINCE=2h task cloud:logs`, `TAIL=200 task cloud:logs:follow`.
  #
  # Health-probe access lines are filtered out. If a follow shows nothing, that is an idle
  # service, not a broken pipe — its recent output was all probes.

  logs:
    desc: 'Show recent logs for a service, pretty-printed (default: banker-copilot-service; pass a deployment name to override)'
    silent: true
    cmds:
      - |
        svc="{{.CLI_ARGS}}"; svc="${svc:-banker-copilot-service}"
        if kubectl get deployment "$svc" -n {{.NAMESPACE}} -o jsonpath='{.spec.template.spec.containers[*].name}' 2>/dev/null | tr ' ' '\n' | grep -qx "$svc"; then CSEL="-c $svc"; else CSEL="--all-containers"; fi
        echo "━━━ $svc — last {{.SINCE}} ━━━"
        if command -v jq >/dev/null 2>&1; then
          kubectl logs -n {{.NAMESPACE}} "deployment/$svc" --since={{.SINCE}} $CSEL 2>&1 \
            | grep -vE 'GET /(healthz|readyz)' \
            | jq -R -r '. as $line | try (fromjson | "\(.timestamp // "")  \((.level // "info") | ascii_upcase)  \(.event // "")  \(del(.timestamp, .level, .event, .logger) | to_entries | map("\(.key)=\(.value)") | join(" "))") catch $line'
        else
          echo "(jq not found — raw output)"
          kubectl logs -n {{.NAMESPACE}} "deployment/$svc" --since={{.SINCE}} $CSEL 2>&1 | grep -vE 'GET /(healthz|readyz)'
        fi
    vars:
      SINCE: '{{.SINCE | default "15m"}}'

  logs:follow:
    desc: 'Stream logs for a service as they arrive (default: banker-copilot-service; Ctrl-C to stop)'
    silent: true
    cmds:
      - |
        svc="{{.CLI_ARGS}}"; svc="${svc:-banker-copilot-service}"
        if kubectl get deployment "$svc" -n {{.NAMESPACE}} -o jsonpath='{.spec.template.spec.containers[*].name}' 2>/dev/null | tr ' ' '\n' | grep -qx "$svc"; then CSEL="-c $svc"; else CSEL="--all-containers"; fi
        echo "━━━ following $svc — Ctrl-C to stop ━━━"
        if command -v jq >/dev/null 2>&1; then
          kubectl logs -n {{.NAMESPACE}} "deployment/$svc" -f --tail={{.TAIL}} $CSEL 2>&1 \
            | grep --line-buffered -vE 'GET /(healthz|readyz)' \
            | jq -R -r --unbuffered '. as $line | try (fromjson | "\(.timestamp // "")  \((.level // "info") | ascii_upcase)  \(.event // "")  \(del(.timestamp, .level, .event, .logger) | to_entries | map("\(.key)=\(.value)") | join(" "))") catch $line'
        else
          kubectl logs -n {{.NAMESPACE}} "deployment/$svc" -f --tail={{.TAIL}} $CSEL 2>&1 | grep --line-buffered -vE 'GET /(healthz|readyz)'
        fi
    vars:
      TAIL: '{{.TAIL | default "50"}}'

  # Model-call health, which is a different question from "what did the service do".
  #
  # Written after a live run came back `planner_model_unavailable` and the cause turned out to
  # be an HTTP 429 from the Foundry deployment — not a timeout, not configuration. That is
  # invisible in the UI, which shows only that the model was unavailable, and easy to miss in
  # raw logs, where it appears as a truncated `detail` field on a warning.
  #
  # Reports counts first because the shape matters more than any single line: one 429 is
  # weather, eighteen across four phases is a saturated deployment. A single objective makes
  # several model calls (intent, answer, primary, supervisor), so one run can burn several
  # requests against the quota and the supervisor fan-out multiplies it again.
  #
  # A 429 here is also the cleanest available proof that the model call is real: the service
  # reached Foundry, and Foundry refused it. Nothing canned gets rate limited.
  logs:model:
    desc: 'Model-call health for banker-copilot-service: rate limits, failures and timeouts, with counts by phase'
    silent: true
    cmds:
      - |
        svc="banker-copilot-service"
        raw="$(kubectl logs -n {{.NAMESPACE}} "deployment/$svc" --since={{.SINCE}} -c banker-copilot-service 2>&1)"

        echo "━━━ Model calls — last {{.SINCE}} ━━━"
        total=$(printf '%s\n' "$raw" | grep -c '"logger": "app.planner.model_call"' || true)
        fails=$(printf '%s\n' "$raw" | grep -c '"event": "Model call failed"' || true)
        retries=$(printf '%s\n' "$raw" | grep -c 'retrying once inside the same budget' || true)
        rl=$(printf '%s\n' "$raw" | grep -c 'rate_limit_exceeded' || true)
        to=$(printf '%s\n' "$raw" | grep -cE '"(error|event)": "[^"]*([Tt]imeout|timed out)[^"]*"' || true)
        echo "  model_call log lines     ${total}"
        echo "  calls that FAILED        ${fails}"
        echo "  retried once             ${retries}"
        echo "  rate limited (HTTP 429)  ${rl}"
        echo "  timeouts                 ${to}"

        echo
        echo "━━━ Failures by phase ━━━"
        printf '%s\n' "$raw" | grep '"event": "Model call failed"' \
          | grep -oE '"phase": "[a-z]+"' | sort | uniq -c | sed 's/^/  /' || echo "  none"

        echo
        echo "━━━ Most recent failures ━━━"
        if command -v jq >/dev/null 2>&1; then
          printf '%s\n' "$raw" | grep -E '"level": "(error|warning)"' \
            | jq -R -r '. as $line | try (fromjson | "  \(.timestamp // "")  \(.event // "")  \(.error // "")  \(.detail // "")") catch empty' \
            | tail -12
        else
          printf '%s\n' "$raw" | grep -E '"level": "(error|warning)"' | tail -12
        fi

        echo
        if [ "${rl}" -gt 0 ]; then
          echo "⚠ HTTP 429 present. The model deployment is rate limited — the service is"
          echo "⚠ reaching Foundry and being refused, which is NOT a timeout and NOT a"
          echo "⚠ misconfiguration. The SDK already retries with sub-second backoff and the"
          echo "⚠ planner retries once more on top; if you are seeing this, both were refused."
          echo "⚠ Wait for the window to clear, or raise the quota on the deployment."
        fi
    vars:
      SINCE: '{{.SINCE | default "30m"}}'

  # === One-time infra configuration ===
  # Run after Terraform creates AKS. Sets up credentials, namespaces, secrets,
  # configmap values, secret-provider-class, and cert-manager.
  #
  # TLS SETUP (3-phase flow):
  #   Phase 1: `infra:config` — installs cert-manager, ClusterIssuer, HTTP gateway,
  #            outputs the ingress IP for DNS configuration.
  #   Phase 2: MANUAL — point your DNS A record to the ingress IP.
  #   Phase 3: `tls:enable` — requests certificate via HTTP-01, routes ACME challenge,
  #            waits for issuance, applies TLS gateway.

  infra:config:
    desc: One-time AKS configuration (credentials, namespaces, secrets, configmap, CSI, cert-manager)
    cmds:
      - az aks get-credentials --resource-group {{.RG_NAME}} --name {{.AKS_NAME}} --overwrite-existing
      - sed -i s/devicecode/azurecli/g ~/.kube/config
      - task: _infra:cert-manager
      - task: _secrets:create
      - task: _configmap:apply
      - task: _secretproviderclass:apply
    vars:
      RG_NAME:
        sh: terraform -chdir=./{{.INFRA_DIR}} output -raw resource_group_name
      AKS_NAME:
        sh: terraform -chdir=./{{.INFRA_DIR}} output -raw aks_name

  _infra:cert-manager:
    internal: true
    silent: true
    desc: Install cert-manager, apply ClusterIssuer and HTTP gateway, output ingress IP
    cmds:
      # 1. Install cert-manager via Helm
      - helm repo add jetstack https://charts.jetstack.io --force-update
      - helm upgrade --install cert-manager jetstack/cert-manager --namespace cert-manager --create-namespace --set crds.enabled=true --wait
      # 2. Apply ClusterIssuer (HTTP-01 with ingress class istio)
      - kubectl apply -f cluster-config/cert-manager/clusterissuer.yaml
      # 3. Apply HTTP-only gateway
      - kubectl apply -f cluster-config/istio/gateway/istio-ingress-gateway.yaml
      # 4. Output the external IP for DNS configuration
      - |
        echo ""
        echo "============================================================"
        echo "  PHASE 1 COMPLETE — cert-manager and HTTP gateway ready"
        echo "============================================================"
        echo ""
        INGRESS_IP=$(kubectl get svc -n aks-istio-ingress -l istio=aks-istio-ingressgateway-external -o jsonpath='{.items[0].status.loadBalancer.ingress[0].ip}' 2>/dev/null)
        if [ -n "$INGRESS_IP" ]; then
          echo "  ➡  Point your DNS for $CUSTOM_DOMAIN to this IP: $INGRESS_IP"
        else
          echo "  ⚠  Ingress IP not yet assigned. Run this to check later:"
          echo "     kubectl get svc -n aks-istio-ingress -l istio=aks-istio-ingressgateway-external"
        fi
        echo ""
        echo "  NEXT STEPS:"
        echo "    1. Create a DNS A record: $CUSTOM_DOMAIN → $INGRESS_IP"
        echo "    2. Wait for DNS to propagate (verify with: dig $CUSTOM_DOMAIN)"
        echo "    3. Run: task cloud:tls:enable"
        echo ""

  tls:enable:
    desc: "Phase 3: Issue Let's Encrypt cert via HTTP-01 and enable HTTPS gateway"
    silent: true
    preconditions:
      - sh: '[ -n "$CUSTOM_DOMAIN" ]'
        msg: "CUSTOM_DOMAIN must be set in .env before running tls:enable"
    cmds:
      # 1. Apply Certificate resource to trigger ACME flow
      - envsubst < cluster-config/cert-manager/certificate.yaml | kubectl apply -f -
      # 2. Check if cert is already issued; skip solver dance if so
      - task: _tls:wait-for-cert-or-solver
      # 3. Clean up solver VirtualService (no-op if it doesn't exist)
      - task: _tls:cleanup-solver
      # 4. Apply TLS gateway (HTTPS + HTTP redirect)
      - envsubst < cluster-config/istio/gateway/istio-ingress-gateway-tls.yaml | kubectl apply -f -
      - |
        echo ""
        echo "✅ TLS enabled for $CUSTOM_DOMAIN"
        echo "   HTTPS is now active — HTTP requests will redirect to HTTPS."
        echo ""

  _tls:wait-for-cert-or-solver:
    internal: true
    silent: true
    desc: If cert already issued skip solver; otherwise wait for solver, route, and wait for cert
    cmds:
      - |
        READY=$(kubectl get certificate banking-demo-tls -n aks-istio-ingress -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null)
        if [ "$READY" = "True" ]; then
          echo "✅ Certificate already issued — skipping ACME solver flow"
          exit 0
        fi

        echo "Waiting for ACME HTTP-01 solver service..."
        SOLVER_SVC=""
        for i in $(seq 1 60); do
          SOLVER_SVC=$(kubectl get svc -n aks-istio-ingress -l "acme.cert-manager.io/http01-solver=true" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
          if [ -n "$SOLVER_SVC" ]; then
            echo "✅ Solver service found: $SOLVER_SVC"
            break
          fi
          sleep 5
        done

        if [ -z "$SOLVER_SVC" ]; then
          echo "ERROR: ACME solver service not found after 5 minutes."
          echo "Check: kubectl get challenges -n aks-istio-ingress"
          exit 1
        fi

        SOLVER_PORT=$(kubectl get svc -n aks-istio-ingress "$SOLVER_SVC" -o jsonpath='{.spec.ports[0].port}')
        cat <<EOF | kubectl apply -f -
        apiVersion: networking.istio.io/v1beta1
        kind: VirtualService
        metadata:
          name: acme-solver-route
          namespace: aks-istio-ingress
        spec:
          hosts:
          - "$CUSTOM_DOMAIN"
          gateways:
          - banking-demo-gateway
          http:
          - match:
            - uri:
                prefix: /.well-known/acme-challenge/
            route:
            - destination:
                host: ${SOLVER_SVC}.aks-istio-ingress.svc.cluster.local
                port:
                  number: ${SOLVER_PORT}
        EOF
        echo "✅ ACME solver VirtualService applied"

        echo "Waiting for certificate to be issued..."
        for i in $(seq 1 60); do
          READY=$(kubectl get certificate banking-demo-tls -n aks-istio-ingress -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null)
          if [ "$READY" = "True" ]; then
            echo "✅ Certificate issued successfully"
            exit 0
          fi
          sleep 5
        done
        echo "ERROR: Certificate not ready after 5 minutes"
        kubectl describe certificate banking-demo-tls -n aks-istio-ingress
        exit 1

  _tls:cleanup-solver:
    internal: true
    silent: true
    desc: Remove ACME solver VirtualService after cert is issued
    cmds:
      - kubectl delete virtualservice acme-solver-route -n aks-istio-ingress --ignore-not-found
      - echo "✅ Solver VirtualService cleaned up"

  tls:status:
    desc: Check TLS certificate and HTTP-01 challenge status
    cmds:
      - kubectl get certificate -n aks-istio-ingress
      - kubectl get certificaterequest -n aks-istio-ingress
      - kubectl get challenges --all-namespaces 2>/dev/null || true
      - kubectl get orders --all-namespaces 2>/dev/null || true

  keyvault:secrets:
    desc: Print the commands to populate Key Vault from the in-VNet jumpbox (secrets are not Terraform-managed)
    cmds:
      - |
        cat <<'NOTE'
        Key Vault secrets are NOT managed by Terraform. The vault data plane is
        reachable only over its private endpoint, so writes from outside the VNet
        fail with ForbiddenByConnection. Run the bootstrap from the jumpbox:
        NOTE
      - terraform -chdir=./{{.INFRA_DIR}} output -raw keyvault_bootstrap_instructions
      - |
        echo
        echo "To reuse the JWT key Terraform holds in state, run on the jumpbox:"
        echo "  JWT_KEY=\"\$(terraform -chdir=./{{.INFRA_DIR}} output -raw jwt_key)\" setup-keyvault-secrets.sh {{.APP_NAME}}"
    vars:
      APP_NAME:
        sh: terraform -chdir=./{{.INFRA_DIR}} output -raw app_name || true

  keyvault:ssh:
    desc: Open the Azure Portal Bastion session for the in-VNet jumpbox (Developer SKU is browser-only)
    cmds:
      - |
        echo "Bastion Developer SKU does not support native-client SSH"
        echo "(az network bastion ssh requires Standard or higher)."
        echo "Open this URL, then connect as 'manager' with your private key:"
        echo
        echo "  https://portal.azure.com/#@/resource{{.JUMPBOX_ID}}/bastionHost"
        echo
        echo "On the jumpbox, run:"
        echo "  setup-keyvault-secrets.sh {{.APP_NAME}}"
    vars:
      JUMPBOX_ID:
        sh: terraform -chdir=./{{.INFRA_DIR}} output -raw jumpbox_id
      APP_NAME:
        sh: terraform -chdir=./{{.INFRA_DIR}} output -raw app_name

  # === Internal tasks ===
  _secrets:create:
    internal: true
    desc: Create namespaces, observability secret, and workload identity service account
    cmds:
      - kubectl create namespace {{.NAMESPACE}} --dry-run=client -o yaml | kubectl apply -f -
      - kubectl create namespace observability --dry-run=client -o yaml | kubectl apply -f -
      - |
        kubectl create secret generic banking-secrets \
          --namespace observability \
          --from-literal=appinsights-connection-string="{{.APPINSIGHTS_CONN}}" \
          --dry-run=client -o yaml | kubectl apply -f -
      - |
        cat <<EOF | kubectl apply -f -
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: banking-workload-identity
          namespace: {{.NAMESPACE}}
          annotations:
            azure.workload.identity/client-id: "{{.AZURE_CLIENT_ID}}"
          labels:
            azure.workload.identity/use: "true"
        EOF
      # authority-service runs under its OWN service account and its OWN managed
      # identity (#336). Reusing banking-workload-identity here would make the
      # approval store writable by every service in the namespace, which is the
      # exact isolation the authority ladder depends on.
      - |
        cat <<EOF | kubectl apply -f -
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: {{.AUTHORITY_SERVICE_ACCOUNT}}
          namespace: {{.NAMESPACE}}
          annotations:
            azure.workload.identity/client-id: "{{.AUTHORITY_CLIENT_ID}}"
          labels:
            azure.workload.identity/use: "true"
            app.kubernetes.io/part-of: banking-demo
        EOF
      # banker-copilot-service likewise runs under its OWN service account and
      # its OWN managed identity (#336). This one matters for a different reason
      # than authority-service's: that identity is narrow so the executor is
      # isolated, this one is narrow so the AGENT is contained. Its Cosmos grant
      # is READ ONLY on copilot-approvals — if the harness could obtain
      # authority-workload-identity's token it could write an approval directly
      # and the "agents never approve" invariant would be enforced only by
      # Python.
      - |
        cat <<EOF | kubectl apply -f -
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: {{.BANKER_COPILOT_SERVICE_ACCOUNT}}
          namespace: {{.NAMESPACE}}
          annotations:
            azure.workload.identity/client-id: "{{.BANKER_COPILOT_CLIENT_ID}}"
          labels:
            azure.workload.identity/use: "true"
            app.kubernetes.io/part-of: banking-demo
        EOF
    vars:
      APPINSIGHTS_CONN:
        sh: terraform -chdir=./{{.INFRA_DIR}} output -raw application_insights_connection_string
      AZURE_CLIENT_ID:
        sh: terraform -chdir=./{{.INFRA_DIR}} output -raw banking_services_client_id
      AUTHORITY_CLIENT_ID:
        sh: terraform -chdir=./{{.INFRA_DIR}} output -raw authority_service_client_id
      AUTHORITY_SERVICE_ACCOUNT:
        sh: terraform -chdir=./{{.INFRA_DIR}} output -raw authority_service_service_account
      BANKER_COPILOT_CLIENT_ID:
        sh: terraform -chdir=./{{.INFRA_DIR}} output -raw banker_copilot_service_client_id
      BANKER_COPILOT_SERVICE_ACCOUNT:
        sh: terraform -chdir=./{{.INFRA_DIR}} output -raw banker_copilot_service_account

  _images:apply:
    internal: true
    desc: Stream-substitute ACR + tag into kustomize build output and apply (manifest on disk is never mutated)
    cmds:
      - |
        kustomize build deploy/kustomize/base \
          | sed -e "s|REPLACE_WITH_ACR_LOGIN_SERVER|{{.ACR_LOGIN_SERVER}}|g" \
                -e "s|REPLACE_WITH_TAG|{{.TAG}}|g" \
          | kubectl apply -f -

  _configmap:apply:
    internal: true
    desc: Stream-substitute env values into configmap and apply (manifest on disk is never mutated)
    cmds:
      - |
        sed -e "s|REPLACE_WITH_COSMOS_ENDPOINT|{{.COSMOS_ENDPOINT}}|g" \
            -e "s|REPLACE_WITH_STORAGE_ACCOUNT|{{.STORAGE_ACCOUNT}}|g" \
            -e "s|REPLACE_WITH_AZURE_CLIENT_ID|{{.AZURE_CLIENT_ID}}|g" \
            -e "s|REPLACE_WITH_TENANT_ID|{{.TENANT_ID}}|g" \
            -e "s|REPLACE_WITH_CHAT_MEMORY_ENABLED|{{.CHAT_MEMORY_ENABLED}}|g" \
            -e "s|REPLACE_WITH_CHAT_MEMORY_EMBEDDING_DEPLOYMENT|{{.CHAT_MEMORY_EMBEDDING_DEPLOYMENT}}|g" \
            -e "s|REPLACE_WITH_BOOTSTRAP_SUPERVISOR_EMAIL|{{.BOOTSTRAP_SUPERVISOR_EMAIL}}|g" \
            -e "s|REPLACE_WITH_BOOTSTRAP_BANKER_EMAIL|{{.BOOTSTRAP_BANKER_EMAIL}}|g" \
            deploy/kustomize/base/configmap.yaml \
          | kubectl apply -n {{.NAMESPACE}} -f -
      # The role model as ONE cluster object, not two.
      #
      # user-service and authority-service both derive banking authority from
      # role-hierarchy.yaml. Both images also bake a copy at build time, which
      # means two images built from different commits can disagree about who
      # outranks whom — and a disagreement in this particular file is a
      # privilege-escalation bug that neither service can detect alone. Mounting
      # one ConfigMap into both pods makes runtime skew impossible regardless of
      # image age, which is the only version of this guarantee that survives a
      # partial rollout.
      #
      # Generated here rather than in kustomize because configMapGenerator will
      # not read outside its own root, and copying the file into deploy/ would
      # have recreated the exact duplication this exists to remove.
      #
      # Re-applied on every deploy, so editing the file and redeploying changes
      # the role model without an image rebuild. Directory mounts (not subPath)
      # are used on both pods so the update lands without a pod restart.
      - |
        kubectl create configmap role-hierarchy \
          --from-file=role-hierarchy.yaml=src/user-service/config/role-hierarchy.yaml \
          -n {{.NAMESPACE}} --dry-run=client -o yaml \
          | kubectl apply -f -
    vars:
      COSMOS_ENDPOINT:
        sh: terraform -chdir=./{{.INFRA_DIR}} output -raw cosmos_db_endpoint
      STORAGE_ACCOUNT:
        sh: terraform -chdir=./{{.INFRA_DIR}} output -raw storage_account_name
      AZURE_CLIENT_ID:
        sh: terraform -chdir=./{{.INFRA_DIR}} output -raw banking_services_client_id
      BOOTSTRAP_SUPERVISOR_EMAIL:
        sh: terraform -chdir=./{{.INFRA_DIR}} output -raw bootstrap_supervisor_email
      BOOTSTRAP_BANKER_EMAIL:
        sh: terraform -chdir=./{{.INFRA_DIR}} output -raw bootstrap_banker_email
      TENANT_ID:
        sh: az account show --query tenantId -o tsv
      CHAT_MEMORY_ENABLED: '{{default "false" .CHAT_MEMORY_ENABLED}}'
      CHAT_MEMORY_EMBEDDING_DEPLOYMENT: '{{default "text-embedding-ada-002" .CHAT_MEMORY_EMBEDDING_DEPLOYMENT}}'

  _secretproviderclass:apply:
    internal: true
    desc: Stream-substitute KV/identity values into SecretProviderClass and apply (manifest on disk is never mutated)
    cmds:
      # Three providers, three identities. A SecretProviderClass names the identity
      # the CSI driver authenticates AS, and it overrides rather than inherits the
      # pod's own — so authority-service and banker-copilot-service, which run under
      # their dedicated UAMIs (#336), each need a provider naming that same UAMI.
      # Substituting one client id into all three would put them straight back to
      # `ClientAssertionCredential authentication failed` and Init that never ends.
      - |
        sed -e "s|REPLACE_WITH_KEYVAULT_NAME|{{.KEYVAULT_NAME}}|g" \
            -e "s|REPLACE_WITH_TENANT_ID|{{.TENANT_ID}}|g" \
            -e "s|REPLACE_WITH_AUTHORITY_CLIENT_ID|{{.AUTHORITY_CLIENT_ID}}|g" \
            -e "s|REPLACE_WITH_COPILOT_CLIENT_ID|{{.COPILOT_CLIENT_ID}}|g" \
            -e "s|REPLACE_WITH_AZURE_CLIENT_ID|{{.AZURE_CLIENT_ID}}|g" \
            deploy/kustomize/base/secret-provider-class.yaml \
          | kubectl apply -n {{.NAMESPACE}} -f -
    vars:
      KEYVAULT_NAME:
        sh: terraform -chdir=./{{.INFRA_DIR}} output -raw key_vault_name
      TENANT_ID:
        sh: az account show --query tenantId -o tsv
      AZURE_CLIENT_ID:
        sh: terraform -chdir=./{{.INFRA_DIR}} output -raw banking_services_client_id
      AUTHORITY_CLIENT_ID:
        sh: terraform -chdir=./{{.INFRA_DIR}} output -raw authority_service_client_id
      COPILOT_CLIENT_ID:
        sh: terraform -chdir=./{{.INFRA_DIR}} output -raw banker_copilot_service_client_id

  _init:
    internal: true
    cmds:
      - terraform -chdir=./{{.INFRA_DIR}} init -upgrade
      - terraform -chdir=./{{.INFRA_DIR}} workspace new {{.REGION}} || true
      - terraform -chdir=./{{.INFRA_DIR}} workspace select {{.REGION}}
    vars:
      REGION: '{{default .DEFAULT_REGION .CLI_ARGS}}'