version: '3'

vars:
  E2E_DIR: tests/e2e

tasks:
  install:
    desc: Install Playwright dependencies and browsers
    dir: '{{.E2E_DIR}}'
    cmds:
      - npm ci
      - npx playwright install --with-deps chromium firefox

  run:
    desc: Run all E2E tests (set BASE_URL for live cluster)
    dir: '{{.E2E_DIR}}'
    cmds:
      - npx playwright test
    env:
      BASE_URL: '{{.BASE_URL | default "http://localhost"}}'

  cloud:
    desc: Run E2E tests against the live AKS cluster
    dir: '{{.E2E_DIR}}'
    cmds:
      - npx playwright test --project=chromium
    env:
      BASE_URL: 'http://{{.GATEWAY_IP}}'
    vars:
      GATEWAY_IP:
        sh: kubectl get svc -n aks-istio-ingress aks-istio-ingressgateway-external -o jsonpath='{.status.loadBalancer.ingress[0].ip}'

  ui:
    desc: Open Playwright UI mode (interactive test runner)
    dir: '{{.E2E_DIR}}'
    cmds:
      - npx playwright test --ui

  headed:
    desc: Run E2E tests with visible browser window
    dir: '{{.E2E_DIR}}'
    cmds:
      - npx playwright test --headed

  debug:
    desc: Run E2E tests in debug mode (headed browser with inspector)
    dir: '{{.E2E_DIR}}'
    cmds:
      - npx playwright test --debug

  report:
    desc: Open the Playwright HTML test report
    dir: '{{.E2E_DIR}}'
    cmds:
      - npx playwright show-report

  phase1:
    desc: "Run Phase 1 — Auth specs (registration, login, session, logout)"
    dir: '{{.E2E_DIR}}'
    cmds:
      - npx playwright test specs/auth/

  phase2:
    desc: "Run Phase 2 — Core banking specs (dashboard, accounts, transactions)"
    dir: '{{.E2E_DIR}}'
    cmds:
      - npx playwright test specs/core/

  phase3:
    desc: "Run Phase 3 — Transfers & budgets"
    dir: '{{.E2E_DIR}}'
    cmds:
      - npx playwright test specs/advanced/

  phase4:
    desc: "Run Phase 4 — Admin, chatbot, concurrency"
    dir: '{{.E2E_DIR}}'
    cmds:
      - npx playwright test specs/admin-ai/

  chromium:
    desc: Run E2E tests in Chromium only
    dir: '{{.E2E_DIR}}'
    cmds:
      - npx playwright test --project=chromium

  firefox:
    desc: Run E2E tests in Firefox only
    dir: '{{.E2E_DIR}}'
    cmds:
      - npx playwright test --project=firefox
