services:
  # API Gateway — routes /api/* to backend services (local-only; AKS uses Istio)
  gateway:
    image: nginx:1.25-alpine
    container_name: banking-gateway
    dns_search: ["."]
    ports:
      - "8080:80"
    volumes:
      - ./infra/local/gateway.nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - account-service
      - transaction-service
      - transfer-service
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Redis — reserved for future caching/session use (no services consume it yet)
  redis:
    image: redis:7-alpine
    container_name: banking-redis
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # User Service
  user-service:
    build:
      context: .
      dockerfile: src/user-service/Dockerfile
    container_name: banking-user-service
    ports:
      - "6001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - UseInMemoryDatabase=true
      - Jwt__Issuer=${JWT_ISSUER:-user-service}
      # No private key configured locally: user-service generates an ephemeral RSA keypair at
      # startup and publishes the public half at /.well-known/jwks.json. That keeps
      # `docker compose up` working with no key material generated, mounted or committed —
      # and no private key is ever baked into an image. In cloud mode (AZURE_CLIENT_ID set)
      # the ephemeral path is refused and a Key Vault key is required.
      - Jwt__MediatorClients__authority-service=${AUTHORITY_MEDIATOR_SECRET:-LocalDevMediatorClientSecret-NotASigningKey}
      - APPLICATIONINSIGHTS_CONNECTION_STRING=
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=user-service
      # Banking authority ladder (epic #332 §5.8.3). In-memory dev mode seeds
      # these two as DISTINCT identities so the L2 co-signature path can be
      # exercised locally — one account holding both roles would demonstrate
      # nothing.
      - Authority__BootstrapBankerEmail=${BOOTSTRAP_BANKER_EMAIL:-banker@banking-demo.com}
      - Authority__BootstrapSupervisorEmail=${BOOTSTRAP_SUPERVISOR_EMAIL:-supervisor@banking-demo.com}
    depends_on:
      redis:
        condition: service_healthy

  # Account Service
  account-service:
    build:
      context: .
      dockerfile: src/account-service/Dockerfile
    container_name: banking-account-service
    ports:
      - "6002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - UseInMemoryDatabase=true
      - APPLICATIONINSIGHTS_CONNECTION_STRING=
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=account-service
    depends_on:
      redis:
        condition: service_healthy

  # Transaction Service
  transaction-service:
    build:
      context: .
      dockerfile: src/transaction-service/Dockerfile
    container_name: banking-transaction-service
    ports:
      - "6003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - UseInMemoryDatabase=true
      - Jwt__Issuer=${JWT_ISSUER:-user-service}
      - Jwt__JwksUri=${JWT_JWKS_URI:-http://user-service:8080/.well-known/jwks.json}
      - Redis__ConnectionString=redis:6379
      - APPLICATIONINSIGHTS_CONNECTION_STRING=
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - CosmosDb__AccountsContainerName=Accounts
      - OTEL_SERVICE_NAME=transaction-service
    depends_on:
      redis:
        condition: service_healthy

  # Transfer Service
  transfer-service:
    build:
      context: .
      dockerfile: src/transfer-service/Dockerfile
    container_name: banking-transfer-service
    ports:
      - "6004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - UseInMemoryDatabase=true
      - Jwt__Issuer=${JWT_ISSUER:-user-service}
      - Jwt__JwksUri=${JWT_JWKS_URI:-http://user-service:8080/.well-known/jwks.json}
      - Redis__ConnectionString=redis:6379
      - Services__AccountService=http://account-service:8080
      - Services__TransactionService=http://transaction-service:8080
      - APPLICATIONINSIGHTS_CONNECTION_STRING=
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=transfer-service
    depends_on:
      redis:
        condition: service_healthy
      account-service:
        condition: service_started
      transaction-service:
        condition: service_started

  # Chatbot Service
  chatbot-service:
    build:
      context: ./src/chatbot-service
      dockerfile: Dockerfile
    container_name: banking-chatbot-service
    ports:
      - "8001:8001"
    environment:
      - FOUNDRY_PROJECT_ENDPOINT=${FOUNDRY_PROJECT_ENDPOINT:-${AZURE_AI_AGENTS_ENDPOINT}}
      - FOUNDRY_MODEL=${FOUNDRY_MODEL:-gpt-5.4-mini}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER:-user-service}
      - JWT_JWKS_URI=${JWT_JWKS_URI:-http://user-service:8080/.well-known/jwks.json}
      - JWT_AUDIENCE=banking-demo/chatbot
      - COSMOS_DB_ENDPOINT=${COSMOS_DB_ENDPOINT:-}
      - CHAT_MEMORY_ENABLED=${CHAT_MEMORY_ENABLED:-false}
      - CHAT_MEMORY_DATABASE=${CHAT_MEMORY_DATABASE:-BankingDemo}
      - CHAT_MEMORY_CONTAINER=${CHAT_MEMORY_CONTAINER:-AgentMemories}
      - CHAT_MEMORY_TURNS_CONTAINER=${CHAT_MEMORY_TURNS_CONTAINER:-AgentMemoryTurns}
      - CHAT_MEMORY_SUMMARIES_CONTAINER=${CHAT_MEMORY_SUMMARIES_CONTAINER:-AgentMemorySummaries}
      - CHAT_MEMORY_COUNTER_CONTAINER=${CHAT_MEMORY_COUNTER_CONTAINER:-AgentMemoryCounters}
      - CHAT_MEMORY_LEASE_CONTAINER=${CHAT_MEMORY_LEASE_CONTAINER:-AgentMemoryLeases}
      - CHAT_MEMORY_MAX_CONTEXT_TURNS=${CHAT_MEMORY_MAX_CONTEXT_TURNS:-8}
      - CHAT_MEMORY_MAX_FACTS=${CHAT_MEMORY_MAX_FACTS:-5}
      - CHAT_MEMORY_MAX_PROMPT_CHARS=${CHAT_MEMORY_MAX_PROMPT_CHARS:-4000}
      - CHAT_MEMORY_MIN_CONFIDENCE=${CHAT_MEMORY_MIN_CONFIDENCE:-0.7}
      - CHAT_MEMORY_PROCESS_EVERY_N_TURNS=${CHAT_MEMORY_PROCESS_EVERY_N_TURNS:-2}
      - CHAT_MEMORY_RECONCILE_EVERY_N_TURNS=${CHAT_MEMORY_RECONCILE_EVERY_N_TURNS:-8}
      - CHAT_MEMORY_EMBEDDING_DEPLOYMENT=${CHAT_MEMORY_EMBEDDING_DEPLOYMENT:-text-embedding-ada-002}
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=chatbot-service
    volumes:
      - ${HOME}/.azure:/home/appuser/.azure:ro
    depends_on:
      - user-service

  # Anomaly Service
  ai-service:
    build:
      context: ./src/ai-service
      dockerfile: Dockerfile
    container_name: banking-ai-service
    ports:
      - "8002:8002"
    environment:
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET:-}
      - REDIS_CONNECTION_STRING=redis:6379
      - JWT_ISSUER=${JWT_ISSUER:-user-service}
      - JWT_JWKS_URI=${JWT_JWKS_URI:-http://user-service:8080/.well-known/jwks.json}
      - JWT_AUDIENCE=banking-demo/ai
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=ai-service
    volumes:
      - ${HOME}/.azure:/home/appuser/.azure:ro
    depends_on:
      redis:
        condition: service_healthy

  # Account Opening Service
  account-opening-service:
    build:
      context: ./src/account-opening-service
      dockerfile: Dockerfile
    container_name: banking-account-opening-service
    ports:
      - "6005:8004"
    environment:
      - USE_IN_MEMORY_DB=true
      - JWT_ISSUER=${JWT_ISSUER:-user-service}
      - JWT_JWKS_URI=${JWT_JWKS_URI:-http://user-service:8080/.well-known/jwks.json}
      - JWT_AUDIENCE=banking-demo/account-opening
      - JWT_ADDITIONAL_AUDIENCES=banking-demo/mediator
      - REDIS_CONNECTION_STRING=redis:6379
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=account-opening-service
    depends_on:
      redis:
        condition: service_healthy

  account-opening-worker:
    build:
      context: ./src/account-opening-service
      dockerfile: Dockerfile
    container_name: banking-account-opening-worker
    command: ["python", "-m", "app.worker"]
    environment:
      - USE_IN_MEMORY_DB=true
      - JWT_ISSUER=${JWT_ISSUER:-user-service}
      - JWT_JWKS_URI=${JWT_JWKS_URI:-http://user-service:8080/.well-known/jwks.json}
      - JWT_AUDIENCE=banking-demo/account-opening
      - JWT_ADDITIONAL_AUDIENCES=banking-demo/mediator
      - REDIS_CONNECTION_STRING=redis:6379
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=account-opening-worker
    depends_on:
      redis:
        condition: service_healthy

  # Budget Service
  budget-service:
    build:
      context: ./src/budget-service
      dockerfile: Dockerfile
    container_name: banking-budget-service
    ports:
      - "8003:8003"
    environment:
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET:-}
      - JWT_ISSUER=${JWT_ISSUER:-user-service}
      - JWT_JWKS_URI=${JWT_JWKS_URI:-http://user-service:8080/.well-known/jwks.json}
      - JWT_AUDIENCE=banking-demo/budget
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=budget-service
    volumes:
      - ${HOME}/.azure:/home/appuser/.azure:ro
    depends_on:
      - transaction-service


  # Authority Service (Banker Copilot policy engine + approval store)
  authority-service:
    build:
      context: .
      dockerfile: src/authority-service/Dockerfile
    container_name: banking-authority-service
    ports:
      - "6010:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - UseInMemoryDatabase=true
      - Jwt__Issuer=${JWT_ISSUER:-user-service}
      - Jwt__JwksUri=${JWT_JWKS_URI:-http://user-service:8080/.well-known/jwks.json}
      # The one mediator client (config/jwt-audiences.yaml). This credential buys a broker
      # token from user-service and nothing else; the harness is deliberately not given it.
      - Jwt__MediatorClientSecret=${AUTHORITY_MEDIATOR_SECRET:-LocalDevMediatorClientSecret-NotASigningKey}
      # Distinct from the approval signing key on purpose: the service refuses to start if
      # they match.
      - Approval__SigningKey=${AUTHORITY_SIGNING_KEY:-LocalDevAuthorityApprovalSigningKey-NotTheJwtKey}
      - POLICY_FILE_PATH=/app/config/authority-policy.yaml
      - ROLE_HIERARCHY_PATH=/app/config/role-hierarchy.yaml
      - Redis__ConnectionString=redis:6379
      # Out-of-band supervisor notification sinks (epic §5.6). Config-driven; redis-stream is
      # the default local sink and publishes to a DEDICATED stream (NOT banking-events). Add
      # `webhook` to the list and set Notifications__WebhookUrl to POST to Teams/Slack.
      - Notifications__Sinks=${AUTHORITY_NOTIFICATION_SINKS:-redis-stream}
      - Notifications__RedisStreamKey=${AUTHORITY_NOTIFICATION_STREAM_KEY:-copilot-notifications}
      - Notifications__WebhookUrl=${AUTHORITY_NOTIFICATION_WEBHOOK_URL:-}
      - Notifications__WebhookTimeoutSeconds=${AUTHORITY_NOTIFICATION_WEBHOOK_TIMEOUT_SECONDS:-5}
      - Notifications__EmailTo=${AUTHORITY_NOTIFICATION_EMAIL_TO:-}
      - Downstream__transaction-service=http://transaction-service:8080
      - Downstream__transfer-service=http://transfer-service:8080
      - Downstream__account-service=http://account-service:8080
      - Downstream__account-opening-service=http://account-opening-service:8000
      - Downstream__user-service=http://user-service:8080
      - Downstream__ai-service=http://ai-service:8002
      - APPLICATIONINSIGHTS_CONNECTION_STRING=
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=authority-service
    volumes:
      # Edit config/authority-policy.yaml locally and restart to change the ladder.
      - ./config/authority-policy.yaml:/app/config/authority-policy.yaml:ro
      # user-service owns this file; authority-service reads it and may not diverge from it.
      - ./src/user-service/config/role-hierarchy.yaml:/app/config/role-hierarchy.yaml:ro
    depends_on:
      redis:
        condition: service_healthy

  # Banker Copilot harness (agent loop). Epic #332 Phase 2.
  #
  # The invariant is that this service registers ZERO write tools: its only write
  # affordance is `propose_action`, an HTTP call to authority-service. In the
  # cloud that is additionally enforced by IAM (infra/cloud/identity-copilot.tf
  # grants it Cosmos READ ONLY on copilot-approvals). Locally there is no IAM, so
  # the enforcement here is entirely the fail-closed tool manifest — which is
  # exactly why the manifest is mounted read-only and the service refuses to
  # start without it.
  banker-copilot-service:
    build:
      # Repository root, not the service directory: the Dockerfile copies the
      # tool manifest and the shared role hierarchy from outside src/banker-copilot-service.
      context: .
      dockerfile: src/banker-copilot-service/Dockerfile
    container_name: banking-banker-copilot-service
    ports:
      - "8005:8005"
    environment:
      # No AZURE_CLIENT_ID here on purpose — its ABSENCE is what selects simple
      # auth mode. The service logs which mode it chose at startup, because in
      # Phase 1 an ambient AZURE_CLIENT_ID silently flipped a service onto Entra
      # and the resulting 500 named neither the mode nor the missing dependency.
      - JWT_ISSUER=${JWT_ISSUER:-user-service}
      - JWT_JWKS_URI=${JWT_JWKS_URI:-http://user-service:8080/.well-known/jwks.json}
      - JWT_AUDIENCE=banking-demo/copilot
      - TOOL_MANIFEST_PATH=/app/config/copilot-tools.yaml
      - ROLE_HIERARCHY_PATH=/app/config/role-hierarchy.yaml
      # The sole write path. Everything below it is read-only.
      - AUTHORITY_SERVICE_URL=http://authority-service:8080
      # Read-tool upstreams (epic §3.3). UPPER_SNAKE after the prefix, matching
      # the AKS ConfigMap exactly — there, hyphenated keys are silently dropped
      # by envFrom, so the two modes must not diverge on this. The service maps
      # `_` back to `-` when resolving a logical service name.
      - DOWNSTREAM__ACCOUNT_SERVICE=http://account-service:8080
      - DOWNSTREAM__TRANSACTION_SERVICE=http://transaction-service:8080
      - DOWNSTREAM__TRANSFER_SERVICE=http://transfer-service:8080
      - DOWNSTREAM__USER_SERVICE=http://user-service:8080
      - DOWNSTREAM__ACCOUNT_OPENING_SERVICE=http://account-opening-service:8004
      - DOWNSTREAM__AI_SERVICE=http://ai-service:8002
      # Harness runtime bounds — configuration, never literals in service code.
      - COPILOT_SSE_HEARTBEAT_SECONDS=${COPILOT_SSE_HEARTBEAT_SECONDS:-15}
      - COPILOT_SSE_REPLAY_WINDOW=${COPILOT_SSE_REPLAY_WINDOW:-500}
      - COPILOT_SESSION_TTL_SECONDS=${COPILOT_SESSION_TTL_SECONDS:-3600}
      - COPILOT_PLANNER_MAX_ITERATIONS=${COPILOT_PLANNER_MAX_ITERATIONS:-12}
      - COPILOT_UPSTREAM_TIMEOUT_MS=${COPILOT_UPSTREAM_TIMEOUT_MS:-8000}
      # Unset locally: the service falls back to in-memory session/trace stores.
      # Container names are still supplied so the same env contract holds in both
      # modes and a name change is made in one place.
      - COSMOS_DB_ENDPOINT=${COSMOS_DB_ENDPOINT:-}
      - COSMOS_DB_DATABASE=${COSMOS_DB_DATABASE:-BankingDemo}
      - COPILOT_SESSIONS_CONTAINER=copilot-sessions
      - COPILOT_ARTIFACTS_CONTAINER=copilot-artifacts
      - COPILOT_TRACES_CONTAINER=copilot-traces
      # Model access for the planner loop. banker-copilot-service reads
      # AZURE_AI_* where the rest of the repo uses FOUNDRY_*; supplying the names
      # the code actually reads, and defaulting from the existing repo variables
      # so an operator's existing .env keeps working.
      - AZURE_AI_PROJECT_ENDPOINT=${AZURE_AI_PROJECT_ENDPOINT:-${FOUNDRY_PROJECT_ENDPOINT:-${AZURE_OPENAI_ENDPOINT:-}}}
      - AZURE_AI_MODEL_DEPLOYMENT=${AZURE_AI_MODEL_DEPLOYMENT:-${FOUNDRY_MODEL:-gpt-5.4-mini}}
      - APPLICATIONINSIGHTS_CONNECTION_STRING=
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=banker-copilot-service
    volumes:
      # Edit config/copilot-tools.yaml locally and restart to change the tool
      # surface. Read-only: a harness that could rewrite its own manifest could
      # grant itself a write tool.
      - ./config/copilot-tools.yaml:/app/config/copilot-tools.yaml:ro
      # Fan-out concurrency limits (epic §6.3). Edit config/harness-limits.yaml locally and
      # restart to re-tune. Read-only: a harness that could rewrite its own limits could grant
      # itself unbounded fan-out.
      - ./config/harness-limits.yaml:/app/config/harness-limits.yaml:ro
      # user-service owns this file; the harness reads it and may not diverge
      # from it. Same mount authority-service takes, from the same source path —
      # three services, one role model, no copies.
      - ./src/user-service/config/role-hierarchy.yaml:/app/config/role-hierarchy.yaml:ro
    # No Redis dependency, deliberately. authority-service owns audit publishing
    # (epic §5.7); giving the harness the banking-events stream would give it the
    # ability to forge an audit event, which is a strange privilege for the one
    # service defined by its inability to act.
    depends_on:
      - authority-service

  # Event Processor (audit/routing consumer)
  event-processor:
    build:
      context: ./src/event-processor
      dockerfile: Dockerfile
    container_name: banking-event-processor
    environment:
      - REDIS__CONNECTIONSTRING=redis:6379
      - APPLICATIONINSIGHTS_CONNECTION_STRING=
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=event-processor
    depends_on:
      redis:
        condition: service_healthy

  # UI Application
  ui-app:
    dns_search: ["."]
    build:
      context: ./src/ui-app
      dockerfile: Dockerfile
    container_name: banking-ui-app
    ports:
      - "3000:8080"
    volumes:
      - ./infra/local/ui-app.nginx.conf:/etc/nginx/nginx.conf:ro
      # Deployment-level feature-flag defaults (layer 3 of the resolver in
      # src/ui-app/src/config/featureFlags.ts). Edit the file and reload the
      # browser — no rebuild, no restart.
      #
      # Mounted from deploy/kustomize/base/ rather than infra/local/ so that
      # docker-compose and the AKS ConfigMap read the SAME file: kustomize will
      # not read outside its own root, and two copies that must agree with
      # nothing comparing them is the bug class that cost us an L1 slot today.
      #
      # Optional by design — delete this line and the app still works, falling
      # back to the template baked into the image.
      - ./deploy/kustomize/base/runtime-config.js:/usr/share/nginx/html/runtime-config.js:ro
    depends_on:
      gateway:
        condition: service_healthy
    restart: on-failure

  # --- Optional: Jaeger for local trace viewing ---
  # Uncomment to enable distributed tracing UI at http://localhost:16686
  # Then set OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317 in your .env file
  #
  # jaeger:
  #   image: jaegertracing/all-in-one:1.54
  #   container_name: banking-jaeger
  #   ports:
  #     - "16686:16686"  # Jaeger UI
  #     - "4317:4317"    # OTLP gRPC receiver
  #     - "4318:4318"    # OTLP HTTP receiver
  #   environment:
  #     - COLLECTOR_OTLP_ENABLED=true

volumes:
  redis-data:
