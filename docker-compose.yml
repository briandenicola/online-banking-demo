version: "3.9"

services:
  # Redis
  redis:
    image: redis:7-alpine
    container_name: banking-redis
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # User Service
  user-service:
    build:
      context: .
      dockerfile: src/user-service/Dockerfile
    container_name: banking-user-service
    ports:
      - "6001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - UseInMemoryDatabase=true
      - Jwt__Key=YourSuperSecretKeyForJWTTokenGeneration12345
      - Jwt__Issuer=user-service
      - APPLICATIONINSIGHTS_CONNECTION_STRING=
    depends_on:
      redis:
        condition: service_healthy

  # Account Service
  account-service:
    build:
      context: .
      dockerfile: src/account-service/Dockerfile
    container_name: banking-account-service
    ports:
      - "6002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - UseInMemoryDatabase=true
      - Jwt__Key=YourSuperSecretKeyForJWTTokenGeneration12345
      - APPLICATIONINSIGHTS_CONNECTION_STRING=
    depends_on:
      redis:
        condition: service_healthy

  # Transaction Service
  transaction-service:
    build:
      context: .
      dockerfile: src/transaction-service/Dockerfile
    container_name: banking-transaction-service
    ports:
      - "6003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - UseInMemoryDatabase=true
      - APPLICATIONINSIGHTS_CONNECTION_STRING=
    depends_on:
      redis:
        condition: service_healthy

  # Transfer Service
  transfer-service:
    build:
      context: .
      dockerfile: src/transfer-service/Dockerfile
    container_name: banking-transfer-service
    ports:
      - "6004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - UseInMemoryDatabase=true
      - Services__AccountService=http://account-service
      - Services__TransactionService=http://transaction-service
      - APPLICATIONINSIGHTS_CONNECTION_STRING=
    depends_on:
      - account-service
      - transaction-service

  # Chatbot Service
  chatbot-service:
    build:
      context: .
      dockerfile: src/chatbot-service/Dockerfile
    container_name: banking-chatbot-service
    ports:
      - "8001:8001"
    environment:
      - AZURE_OPENAI_ENDPOINT=
      - AZURE_OPENAI_KEY=
      - APPLICATIONINSIGHTS_CONNECTION_STRING=
    depends_on:
      - user-service

  # Anomaly Service
  anomaly-service:
    build:
      context: .
      dockerfile: src/anomaly-service/Dockerfile
    container_name: banking-anomaly-service
    ports:
      - "8002:8002"
    environment:
      - EVENTHUB_CONNECTION_STRING=
      - APPLICATIONINSIGHTS_CONNECTION_STRING=
    depends_on:
      - transaction-service

  # Budget Service
  budget-service:
    build:
      context: .
      dockerfile: src/budget-service/Dockerfile
    container_name: banking-budget-service
    ports:
      - "8003:8003"
    environment:
      - EVENTHUB_CONNECTION_STRING=
      - APPLICATIONINSIGHTS_CONNECTION_STRING=
    depends_on:
      - transaction-service

  # API Gateway (NGINX)
  gateway:
    image: nginx:alpine
    container_name: banking-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - account-service
      - transaction-service
      - transfer-service
      - chatbot-service

  # UI Application
  ui-app:
    build:
      context: ./src/ui-app
      dockerfile: Dockerfile
    container_name: banking-ui-app
    ports:
      - "3000:80"
    depends_on:
      - gateway