services:
  # Redis — reserved for future caching/session use (no services consume it yet)
  redis:
    image: redis:7-alpine
    container_name: banking-redis
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # User Service
  user-service:
    build:
      context: .
      dockerfile: src/user-service/Dockerfile
    container_name: banking-user-service
    ports:
      - "6001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - UseInMemoryDatabase=true
      - Jwt__Key=YourSuperSecretKeyForJWTTokenGeneration12345
      - Jwt__Issuer=user-service
      - APPLICATIONINSIGHTS_CONNECTION_STRING=
    depends_on:
      redis:
        condition: service_healthy

  # Account Service
  account-service:
    build:
      context: .
      dockerfile: src/account-service/Dockerfile
    container_name: banking-account-service
    ports:
      - "6002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - UseInMemoryDatabase=true
      - Jwt__Key=YourSuperSecretKeyForJWTTokenGeneration12345
      - APPLICATIONINSIGHTS_CONNECTION_STRING=
    depends_on:
      redis:
        condition: service_healthy

  # Transaction Service
  transaction-service:
    build:
      context: .
      dockerfile: src/transaction-service/Dockerfile
    container_name: banking-transaction-service
    ports:
      - "6003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - UseInMemoryDatabase=true
      - Redis__ConnectionString=redis:6379
      - APPLICATIONINSIGHTS_CONNECTION_STRING=
    depends_on:
      redis:
        condition: service_healthy

  # Transfer Service
  transfer-service:
    build:
      context: .
      dockerfile: src/transfer-service/Dockerfile
    container_name: banking-transfer-service
    ports:
      - "6004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - UseInMemoryDatabase=true
      - Redis__ConnectionString=redis:6379
      - Services__AccountService=http://account-service
      - Services__TransactionService=http://transaction-service
      - APPLICATIONINSIGHTS_CONNECTION_STRING=
    depends_on:
      redis:
        condition: service_healthy
      account-service:
        condition: service_started
      transaction-service:
        condition: service_started

  # Chatbot Service
  chatbot-service:
    build:
      context: .
      dockerfile: src/chatbot-service/Dockerfile
    container_name: banking-chatbot-service
    ports:
      - "8001:8001"
    environment:
      - AZURE_AI_AGENTS_ENDPOINT=${AZURE_AI_AGENTS_ENDPOINT}
      - AZURE_OPENAI_MODEL=${AZURE_OPENAI_MODEL:-gpt-4o-mini}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET:-}
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING}
    volumes:
      - ${HOME}/.azure:/home/appuser/.azure:ro
    depends_on:
      - user-service

  # Anomaly Service
  anomaly-service:
    build:
      context: .
      dockerfile: src/anomaly-service/Dockerfile
    container_name: banking-anomaly-service
    ports:
      - "8002:8002"
    environment:
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET:-}
      - REDIS__CONNECTIONSTRING=redis:6379
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING}
    volumes:
      - ${HOME}/.azure:/home/appuser/.azure:ro
    depends_on:
      redis:
        condition: service_healthy

  # Budget Service
  budget-service:
    build:
      context: .
      dockerfile: src/budget-service/Dockerfile
    container_name: banking-budget-service
    ports:
      - "8003:8003"
    environment:
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET:-}
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
    volumes:
      - ${HOME}/.azure:/home/appuser/.azure:ro
    depends_on:
      - transaction-service

  # API Gateway (NGINX)
  gateway:
    image: nginx:alpine
    container_name: banking-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - account-service
      - transaction-service
      - transfer-service
      - chatbot-service

  # Event Processor (audit/routing consumer)
  event-processor:
    build:
      context: ./src/event-processor
      dockerfile: Dockerfile
    container_name: banking-event-processor
    environment:
      - REDIS__CONNECTIONSTRING=redis:6379
      - APPLICATIONINSIGHTS_CONNECTION_STRING=
    depends_on:
      redis:
        condition: service_healthy

  # UI Application
  ui-app:
    build:
      context: ./src/ui-app
      dockerfile: Dockerfile
    container_name: banking-ui-app
    ports:
      - "3000:80"
    depends_on:
      - gateway

volumes:
  redis-data: