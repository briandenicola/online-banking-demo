load_module modules/ngx_http_js_module.so;

events {
    worker_connections 1024;
}

env JWT_KEY;
env JWT_ISSUER;

http {
    js_import jwt from /etc/nginx/njs/jwt_validate.js;

    # --- Rate Limiting Zones ---
    # 100 req/min per IP for general API
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    # 10 req/min per IP for auth endpoints
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

    limit_req_status 429;

    upstream user_service {
        server user-service:8080;
    }

    upstream account_service {
        server account-service:8080;
    }

    upstream transaction_service {
        server transaction-service:8080;
    }

    upstream transfer_service {
        server transfer-service:8080;
    }

    upstream chatbot_service {
        server chatbot-service:8001;
    }

    upstream anomaly_service {
        server anomaly-service:8002;
    }

    upstream budget_service {
        server budget-service:8003;
    }

    server {
        listen 80;

        # --- Security Headers ---
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Default - API documentation landing page
        location = / {
            default_type text/html;
            return 200 '<!DOCTYPE html>
<html>
<head><title>Online Banking Demo API</title></head>
<body>
<h1>Online Banking Demo API Gateway</h1>
<h2>Available Endpoints:</h2>
<h3>.NET Services</h3>
<ul>
<li><a href="/api/users/swagger/index.html">User Service Swagger</a> - Authentication and User Management</li>
<li><a href="/api/accounts/swagger/index.html">Account Service Swagger</a> - Account Operations</li>
<li><a href="/api/transactions/swagger/index.html">Transaction Service Swagger</a> - Transaction History</li>
<li><a href="/api/transfers/swagger/index.html">Transfer Service Swagger</a> - Money Transfers</li>
</ul>
<h3>Python Agent Services</h3>
<ul>
<li><a href="/api/chat/docs">Chatbot Service Docs</a> - AI Financial Assistant</li>
<li><a href="/api/anomaly/docs">Anomaly Detection Docs</a> - Fraud Detection</li>
<li><a href="/api/budget/docs">Budget Analysis Docs</a> - Spending Insights</li>
</ul>
<p><a href="/health">Health Check</a></p>
</body>
</html>';
        }

        # --- Public Auth Endpoints (no JWT required, stricter rate limit) ---
        location /api/users/login {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/users/register {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # --- Protected API Routes (JWT validation + standard rate limit) ---
        location /api/auth/ {
            js_content jwt.jwt_validate;
            limit_req zone=api_limit burst=20 nodelay;
        }

        location /api/users/ {
            js_content jwt.jwt_validate;
            limit_req zone=api_limit burst=20 nodelay;
        }

        location /api/accounts/ {
            js_content jwt.jwt_validate;
            limit_req zone=api_limit burst=20 nodelay;
        }

        location /api/transactions/ {
            js_content jwt.jwt_validate;
            limit_req zone=api_limit burst=20 nodelay;
        }

        location /api/transfers/ {
            js_content jwt.jwt_validate;
            limit_req zone=api_limit burst=20 nodelay;
        }

        location /api/chat {
            js_content jwt.jwt_validate;
            limit_req zone=api_limit burst=20 nodelay;
        }

        location /api/admin/ {
            js_content jwt.jwt_validate;
            limit_req zone=api_limit burst=20 nodelay;
        }

        location /api/anomaly/ {
            js_content jwt.jwt_validate;
            limit_req zone=api_limit burst=20 nodelay;
        }

        location /api/budget/ {
            js_content jwt.jwt_validate;
            limit_req zone=api_limit burst=20 nodelay;
        }

        # --- Internal upstream targets (reached via internalRedirect after JWT validation) ---
        location @upstream {
            internal;

            set $target "";

            if ($uri ~ ^/api/auth/) {
                set $target "http://user_service";
            }
            if ($uri ~ ^/api/users/) {
                set $target "http://user_service";
            }
            if ($uri ~ ^/api/accounts/) {
                set $target "http://account_service";
            }
            if ($uri ~ ^/api/transactions/) {
                set $target "http://transaction_service/api/transactions/";
            }
            if ($uri ~ ^/api/transfers/) {
                set $target "http://transfer_service";
            }
            if ($uri ~ ^/api/chat) {
                set $target "http://chatbot_service/api/chat";
            }
            if ($uri ~ ^/api/admin/) {
                set $target "http://anomaly_service/api/admin/";
            }
            if ($uri ~ ^/api/anomaly/) {
                set $target "http://anomaly_service";
            }
            if ($uri ~ ^/api/budget/) {
                set $target "http://budget_service";
            }

            proxy_pass $target;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-User-Id $http_x_user_id;
        }

        # Health endpoints (public, no JWT)
        location = /health {
            default_type text/plain;
            return 200 'OK';
        }
    }
}
