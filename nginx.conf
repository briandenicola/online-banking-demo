events {
    worker_connections 1024;
}

http {
    upstream user_service {
        server user-service:8080;
    }

    upstream account_service {
        server account-service:8080;
    }

    upstream transaction_service {
        server transaction-service:8080;
    }

    upstream transfer_service {
        server transfer-service:8080;
    }

    upstream chatbot_service {
        server chatbot-service:8001;
    }

    upstream anomaly_service {
        server anomaly-service:8002;
    }

    upstream budget_service {
        server budget-service:8003;
    }

    server {
        listen 80;

        # Default - API documentation landing page
        location = / {
            default_type text/html;
            return 200 '<!DOCTYPE html>
<html>
<head><title>Online Banking Demo API</title></head>
<body>
<h1>🏦 Online Banking Demo API Gateway</h1>
<h2>Available Endpoints:</h2>
<h3>.NET Services</h3>
<ul>
<li><a href="/api/users/swagger/index.html">User Service Swagger</a> - Authentication & User Management</li>
<li><a href="/api/accounts/swagger/index.html">Account Service Swagger</a> - Account Operations</li>
<li><a href="/api/transactions/swagger/index.html">Transaction Service Swagger</a> - Transaction History</li>
<li><a href="/api/transfers/swagger/index.html">Transfer Service Swagger</a> - Money Transfers</li>
</ul>
<h3>Python Agent Services</h3>
<ul>
<li><a href="/api/chat/docs">Chatbot Service Docs</a> - AI Financial Assistant</li>
<li><a href="/api/anomaly/docs">Anomaly Detection Docs</a> - Fraud Detection</li>
<li><a href="/api/budget/docs">Budget Analysis Docs</a> - Spending Insights</li>
</ul>
<p><a href="/health">Health Check</a></p>
</body>
</html>';
        }

        # API Routes - .NET Services
        location /api/auth/ {
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/users/ {
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/accounts/ {
            proxy_pass http://account_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/transactions/ {
            proxy_pass http://transaction_service/api/transactions/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/transfers/ {
            proxy_pass http://transfer_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API Routes - Python Services
        location /api/chat {
            proxy_pass http://chatbot_service/api/chat;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/admin/ {
            proxy_pass http://anomaly_service/api/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/anomaly/ {
            proxy_pass http://anomaly_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/budget/ {
            proxy_pass http://budget_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health endpoints
        location = /health {
            default_type text/plain;
            return 200 'OK';
        }
    }
}