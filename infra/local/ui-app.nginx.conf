worker_processes auto;
pid /tmp/nginx.pid;
error_log stderr;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Use /tmp for temp paths so container works with read-only root filesystem
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    keepalive_timeout 65;

    access_log off;

    server {
        listen 8080;
        server_name localhost;

        # Copilot harness SSE trace stream. Must precede the generic /api/ block
        # and must disable buffering at BOTH hops — the ui-app nginx would
        # otherwise re-buffer a stream the gateway just took care to pass through
        # unbuffered, and the trace would still arrive as one lump.
        location /api/copilot/ {
            proxy_pass http://gateway/api/copilot/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            # Chunked encoding stays ON (nginx default), matching
            # docs/design/banker-copilot-ui.md §4.1. Phase 1 shipped
            # `chunked_transfer_encoding off` here, which is wrong for this
            # stream: with no Content-Length and no chunking, nginx delimits the
            # response by closing the connection, so a network drop mid-run is
            # byte-for-byte indistinguishable from a clean end-of-stream. The
            # browser's fetch() reader would surface a truncated trace as a
            # normal completion and the client's reconnect logic (§4.5) would
            # never fire — the exact "a dead stream must never look like a
            # working one" failure §4.6 exists to prevent. Chunked framing makes
            # a truncated stream raise a network error instead.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/ {
            proxy_pass http://gateway/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

    }
}
