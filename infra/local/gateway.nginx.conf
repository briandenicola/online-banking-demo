worker_processes auto;
pid /tmp/nginx.pid;
error_log stderr;

events {
    worker_connections 1024;
}

http {
    # Use /tmp for temp paths
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    keepalive_timeout 65;
    access_log /dev/stdout combined;

    # Increase buffer sizes for larger payloads (document uploads, etc.)
    client_max_body_size 50m;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Docker DNS; docker-compose sets dns_search ["."] to prevent host search-domain leaks.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name localhost;

        # Auth endpoints → user-service
        location /api/auth/ {
            set $upstream_user_service user-service:8080;
            proxy_pass http://$upstream_user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Users endpoints → user-service
        location /api/users/ {
            set $upstream_user_service user-service:8080;
            proxy_pass http://$upstream_user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Accounts endpoints → account-service
        location = /api/accounts {
            set $upstream_account_service account-service:8080;
            proxy_pass http://$upstream_account_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/accounts/ {
            set $upstream_account_service account-service:8080;
            proxy_pass http://$upstream_account_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Transactions endpoints → transaction-service
        location /api/transactions/ {
            set $upstream_transaction_service transaction-service:8080;
            proxy_pass http://$upstream_transaction_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Transfers endpoints → transfer-service
        location /api/transfers/ {
            set $upstream_transfer_service transfer-service:8080;
            proxy_pass http://$upstream_transfer_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Chat endpoints → chatbot-service
        location /api/chat/ {
            set $upstream_chatbot_service chatbot-service:8001;
            proxy_pass http://$upstream_chatbot_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Account opening endpoints → account-opening-service
        location /api/account-opening/ {
            set $upstream_account_opening_service account-opening-service:8004;
            proxy_pass http://$upstream_account_opening_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Authority endpoints → authority-service (epic #332).
        # This is the ONLY component permitted to perform an agent-originated
        # write. Kept on its own /api/authority/ prefix, not folded under
        # /api/copilot/, so the enforcement boundary is legible in the URL and
        # cannot be silently re-routed to the harness by location ordering.
        location /api/authority/ {
            set $upstream_authority_service authority-service:8080;
            proxy_pass http://$upstream_authority_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Copilot harness endpoints → banker-copilot-service (epic #332 Phase 2).
        # Carries the session SSE trace stream
        # (GET /api/copilot/sessions/{id}/stream), so response buffering MUST stay
        # off: with the default buffering nginx accumulates the whole event
        # stream and delivers it as one lump when the connection closes, which
        # turns a live trace into a post-mortem. Also disable chunked re-encoding
        # and give the upstream a long read timeout, because an SSE connection is
        # idle between frames by design.
        location /api/copilot/ {
            set $upstream_banker_copilot_service banker-copilot-service:8005;
            proxy_pass http://$upstream_banker_copilot_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            chunked_transfer_encoding off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Admin user management → user-service
        location /api/admin/users {
            set $upstream_user_service user-service:8080;
            proxy_pass http://$upstream_user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin login audits → user-service
        location /api/admin/login-audits {
            set $upstream_user_service user-service:8080;
            proxy_pass http://$upstream_user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin promote → user-service
        location /api/admin/promote {
            set $upstream_user_service user-service:8080;
            proxy_pass http://$upstream_user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin replay-events → transaction-service
        location /api/admin/replay-events {
            set $upstream_transaction_service transaction-service:8080;
            proxy_pass http://$upstream_transaction_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # All other admin endpoints → ai-service
        location /api/admin/ {
            set $upstream_ai_service ai-service:8002;
            proxy_pass http://$upstream_ai_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check
        location /health {
            return 200 "Gateway OK\n";
            add_header Content-Type text/plain;
        }
    }
}
