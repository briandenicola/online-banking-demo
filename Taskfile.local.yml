version: '3'

env:
  LOCAL_INFRA_DIR: infra/local

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  up:
    desc: Creates complete Azure environment for {{.TITLE}} (includes AI Foundry)
    cmds:
      - task: _init
      - task: apply

  apply:
    desc: Apply Terraform infrastructure
    cmds:
      - terraform -chdir=./{{.LOCAL_INFRA_DIR}} apply -auto-approve -compact-warnings
        -var "region={{.REGION}}"
        -var "tags={{.TITLE}}"
    vars:
      REGION: '{{default .DEFAULT_REGION .CLI_ARGS}}'

  down:
    desc: Destroys all Azure resources and cleans up Terraform
    dir: '{{.LOCAL_INFRA_DIR}}'
    cmds:
      - az group list --tag Application="{{.TITLE}}" --query "[].name" -o tsv | xargs -ot -n 1 az group delete -y --no-wait -n || true
      - rm -rf terraform.tfstate.d .terraform.lock.hcl .terraform terraform.tfstate terraform.tfstate.backup .terraform.tfstate.lock.info terraform.tfstate.* || true

  output-env:
    desc: Print environment variables to stdout (for debugging — values are visible)
    silent: false
    dir: '{{.LOCAL_INFRA_DIR}}'
    cmds:
      - |
        echo "# Azure AI Foundry Environment (RBAC auth)"
        echo "AZURE_OPENAI_ENDPOINT={{.AZURE_OPENAI_ENDPOINT}}"
        echo "AZURE_CLIENT_ID={{.AZURE_CLIENT_ID}}"
        echo "AZURE_OPENAI_MODEL={{.AZURE_OPENAI_MODEL}}"
        echo "AZURE_OPENAI_EMBEDDING_MODEL={{.AZURE_OPENAI_EMBEDDING_MODEL}}"
        echo "APPLICATIONINSIGHTS_CONNECTION_STRING={{.APPLICATIONINSIGHTS_CONNECTION_STRING}}"
        echo "JWT_KEY={{.JWT_KEY}}"
    vars:
      AZURE_OPENAI_MODEL: gpt-5.4
      AZURE_OPENAI_EMBEDDING_MODEL: text-embedding-3-large
      AZURE_OPENAI_ENDPOINT:
        sh: terraform -chdir=./{{.LOCAL_INFRA_DIR}} output -raw openai_endpoint
      AZURE_CLIENT_ID:
        sh: terraform -chdir=./{{.LOCAL_INFRA_DIR}} output -raw managed_identity_client_id
      APPLICATIONINSIGHTS_CONNECTION_STRING:
        sh: terraform -chdir=./{{.LOCAL_INFRA_DIR}} output -raw application_insights_connection_string
      JWT_KEY:
        sh: openssl rand -base64 32

  run:
    desc: Run Docker Compose locally
    deps: [_init-env]
    cmds:
      - docker-compose --env-file .env up -d
  stop:
    desc: Stop Docker Compose
    cmds:
      - docker-compose down

  logs:
    desc: Follow Docker Compose logs
    cmds:
      - docker-compose logs -f

  test:
    desc: Run all tests
    cmds:
      - dotnet test src/shared/Contracts/Contracts.csproj
      - cd src/chatbot-service && poetry run pytest || true
      - cd src/event-processor && go test ./... || true

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf src/**/bin src/**/obj
      - rm -rf node_modules dist

  # === Internal tasks ===
  _init-env:
    internal: true
    silent: true
    desc: Write Terraform outputs to .env file
    status:
      - test -f .env && test .env -nt {{.LOCAL_INFRA_DIR}}/terraform.tfstate
    cmds:
      - |
        printf '%s\n' \
          "# Auto-generated by task local:_init-env — do not edit manually" \
          "AZURE_OPENAI_ENDPOINT={{.AZURE_OPENAI_ENDPOINT}}" \
          "AZURE_AI_AGENTS_ENDPOINT={{.AZURE_OPENAI_ENDPOINT}}" \
          "AZURE_CLIENT_ID={{.AZURE_CLIENT_ID}}" \
          "AZURE_OPENAI_MODEL={{.AZURE_OPENAI_MODEL}}" \
          "AZURE_OPENAI_EMBEDDING_MODEL={{.AZURE_OPENAI_EMBEDDING_MODEL}}" \
          "APPLICATIONINSIGHTS_CONNECTION_STRING={{.APPLICATIONINSIGHTS_CONNECTION_STRING}}" \
          "JWT_KEY={{.JWT_KEY}}" \
          > .env
    vars:
      AZURE_OPENAI_MODEL: gpt-5.4
      AZURE_OPENAI_EMBEDDING_MODEL: text-embedding-3-large
      AZURE_OPENAI_ENDPOINT:
        sh: terraform -chdir=./{{.LOCAL_INFRA_DIR}} output -raw openai_endpoint
      AZURE_CLIENT_ID:
        sh: terraform -chdir=./{{.LOCAL_INFRA_DIR}} output -raw managed_identity_client_id
      APPLICATIONINSIGHTS_CONNECTION_STRING:
        sh: terraform -chdir=./{{.LOCAL_INFRA_DIR}} output -raw application_insights_connection_string
      JWT_KEY:
        sh: if [ -f .env ] && grep -q '^JWT_KEY=' .env; then grep '^JWT_KEY=' .env | cut -d= -f2; else openssl rand -base64 32; fi

  _init:
    internal: true
    cmds:
      - terraform -chdir=./{{.LOCAL_INFRA_DIR}} init -upgrade
      - terraform -chdir=./{{.LOCAL_INFRA_DIR}} workspace new {{.REGION}} || true
      - terraform -chdir=./{{.LOCAL_INFRA_DIR}} workspace select {{.REGION}}
    vars:
      REGION: '{{default .DEFAULT_REGION .CLI_ARGS}}'