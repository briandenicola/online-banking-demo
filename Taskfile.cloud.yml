version: '3'

env:
  INFRA_DIR: infra/cloud

vars:
  ACR_NAME:
    sh: terraform -chdir=./{{.INFRA_DIR}} output -raw acr_name
  ACR_LOGIN_SERVER:
    sh: terraform -chdir=./{{.INFRA_DIR}} output -raw acr_login_server
  TAG: '{{default "latest" .CLI_ARGS}}'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  up:
    desc: Creates complete Azure environment for {{.TITLE}} (includes AI Foundry)
    cmds:
      - task: _init
      - task: apply
      - task: output-env

  apply:
    desc: Apply Terraform infrastructure
    cmds:
      - terraform -chdir=./{{.INFRA_DIR}} apply -auto-approve -compact-warnings
        -var "region={{.REGION}}"
        -var "deploy_embedding_model={{.DEPLOY_EMBEDDING_MODEL}}"
    vars:
      REGION: '{{default .DEFAULT_REGION .CLI_ARGS}}'
      DEPLOY_EMBEDDING_MODEL: '{{default "false" .DEPLOY_EMBEDDING_MODEL}}'

  down:
    desc: Destroys all Azure resources and cleans up Terraform
    dir: '{{.INFRA_DIR}}'
    cmds:
      - az group list --tag Application="{{.TITLE}}" --query "[].name" -o tsv | xargs -ot -n 1 az group delete -y --no-wait -n || true
      - rm -rf terraform.tfstate.d .terraform.lock.hcl .terraform terraform.tfstate terraform.tfstate.backup .terraform.tfstate.lock.info terraform.tfstate.* || true

  output-env:
    desc: Output environment variables for local AI development
    dir: '{{.INFRA_DIR}}'
    cmds:
      - |
        echo "# Azure AI Foundry Environment (RBAC auth)"
        echo "AZURE_OPENAI_ENDPOINT={{.AZURE_OPENAI_ENDPOINT}}"
        echo "AZURE_CLIENT_ID={{.AZURE_CLIENT_ID}}"
        echo "AZURE_OPENAI_MODEL={{.AZURE_OPENAI_MODEL}}"
        echo "AZURE_OPENAI_EMBEDDING_MODEL={{.AZURE_OPENAI_EMBEDDING_MODEL}}"
        echo "APPLICATIONINSIGHTS_CONNECTION_STRING={{.APPLICATIONINSIGHTS_CONNECTION_STRING}}"
        echo "EVENTHUB_CONNECTION_STRING={{.EVENTHUB_CONNECTION_STRING}}"
    silent: true
    vars:
      AZURE_OPENAI_MODEL: gpt-5.4-mini
      AZURE_OPENAI_EMBEDDING_MODEL: text-embedding-ada-002
      AZURE_OPENAI_ENDPOINT:
        sh: terraform output -raw openai_endpoint
      AZURE_CLIENT_ID:
        sh: terraform output -raw managed_identity_client_id
      APPLICATIONINSIGHTS_CONNECTION_STRING:
        sh: terraform output -raw application_insights_connection_string
      EVENTHUB_CONNECTION_STRING:
        sh: terraform output -raw eventhub_connection_string

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf src/**/bin src/**/obj
      - rm -rf node_modules dist

  build:
    desc: Build all container images using Azure ACR
    cmds:
      - task: build:dotnet
      - task: build:python
      - task: build:ui

  build:dotnet:
    desc: Build all .NET service images
    cmds:
      - az acr build --registry {{.ACR_NAME}} --image user-service:{{.TAG}} ./src/user-service/
      - az acr build --registry {{.ACR_NAME}} --image account-service:{{.TAG}} ./src/account-service/
      - az acr build --registry {{.ACR_NAME}} --image transaction-service:{{.TAG}} ./src/transaction-service/
      - az acr build --registry {{.ACR_NAME}} --image transfer-service:{{.TAG}} ./src/transfer-service/

  build:python:
    desc: Build all Python service images
    cmds:
      - az acr build --registry {{.ACR_NAME}} --image chatbot-service:{{.TAG}} ./src/chatbot-service/
      - az acr build --registry {{.ACR_NAME}} --image budget-service:{{.TAG}} ./src/budget-service/
      - az acr build --registry {{.ACR_NAME}} --image anomaly-service:{{.TAG}} ./src/anomaly-service/
      - az acr build --registry {{.ACR_NAME}} --image event-processor:{{.TAG}} ./src/event-processor/

  build:ui:
    desc: Build UI application image
    cmds:
      - az acr build --registry {{.ACR_NAME}} --image ui-app:{{.TAG}} ./src/ui-app/

  deploy:
    desc: Deploy application to Kubernetes cluster (updates image refs then applies)
    cmds:
      - task: _images:update
      - kubectl apply -k deploy/kustomize/base/

  # === Internal tasks ===
  _images:update:
    internal: true
    desc: Update Kustomize image references to ACR
    dir: deploy/kustomize/base
    cmds:
      - kustomize edit set image ghcr.io/banking-demo/user-service={{.ACR_LOGIN_SERVER}}/user-service:{{.TAG}}
      - kustomize edit set image ghcr.io/banking-demo/account-service={{.ACR_LOGIN_SERVER}}/account-service:{{.TAG}}
      - kustomize edit set image ghcr.io/banking-demo/transaction-service={{.ACR_LOGIN_SERVER}}/transaction-service:{{.TAG}}
      - kustomize edit set image ghcr.io/banking-demo/transfer-service={{.ACR_LOGIN_SERVER}}/transfer-service:{{.TAG}}
      - kustomize edit set image ghcr.io/banking-demo/chatbot-service={{.ACR_LOGIN_SERVER}}/chatbot-service:{{.TAG}}
      - kustomize edit set image ghcr.io/banking-demo/budget-service={{.ACR_LOGIN_SERVER}}/budget-service:{{.TAG}}
      - kustomize edit set image ghcr.io/banking-demo/anomaly-service={{.ACR_LOGIN_SERVER}}/anomaly-service:{{.TAG}}
      - kustomize edit set image ghcr.io/banking-demo/event-processor={{.ACR_LOGIN_SERVER}}/event-processor:{{.TAG}}
      - kustomize edit set image ghcr.io/banking-demo/ui-app={{.ACR_LOGIN_SERVER}}/ui-app:{{.TAG}}

  _init:
    internal: true
    cmds:
      - terraform -chdir=./{{.INFRA_DIR}} init -upgrade
      - terraform -chdir=./{{.INFRA_DIR}} workspace new {{.REGION}} || true
      - terraform -chdir=./{{.INFRA_DIR}} workspace select {{.REGION}}
    vars:
      REGION: '{{default .DEFAULT_REGION .CLI_ARGS}}'