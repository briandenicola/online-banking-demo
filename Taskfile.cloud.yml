version: '3'

env:
  INFRA_DIR: infra/cloud
  DEPLOY_EMBEDDING_MODEL: false

vars:
  ACR_NAME:
    sh: terraform -chdir=./{{.INFRA_DIR}} output -raw acr_name
  ACR_LOGIN_SERVER:
    sh: terraform -chdir=./{{.INFRA_DIR}} output -raw acr_login_server
  TAG: '{{default "latest" .CLI_ARGS}}'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  up:
    desc: Creates complete Azure environment for {{.TITLE}} (includes AI Foundry)
    cmds:
      - task: _init
      - task: apply
      - task: infra:config

  apply:
    desc: Apply Terraform infrastructure
    cmds:
      - terraform -chdir=./{{.INFRA_DIR}} apply -auto-approve -compact-warnings
        -var "region={{.REGION}}"
        -var "deploy_embedding_model={{.DEPLOY_EMBEDDING_MODEL}}"
    vars:
      REGION: '{{default .DEFAULT_REGION .CLI_ARGS}}'

  down:
    desc: Destroys all Azure resources and cleans up Terraform
    dir: '{{.INFRA_DIR}}'
    cmds:
      - az group list --tag Application="{{.TITLE}}" --query "[].name" -o tsv | xargs --no-run-if-empty -ot -n 1 az group delete -y --no-wait -n || true
      - rm -rf terraform.tfstate.d .terraform.lock.hcl .terraform terraform.tfstate terraform.tfstate.backup .terraform.tfstate.lock.info terraform.tfstate.* || true

  output-env:
    desc: Output environment variables for local AI development
    dir: '{{.INFRA_DIR}}'
    cmds:
      - |
        echo "# Azure AI Foundry Environment (RBAC auth)"
        echo "AZURE_OPENAI_ENDPOINT={{.AZURE_OPENAI_ENDPOINT}}"
        echo "AZURE_CLIENT_ID={{.AZURE_CLIENT_ID}}"
        echo "AZURE_OPENAI_MODEL={{.AZURE_OPENAI_MODEL}}"
        echo "AZURE_OPENAI_EMBEDDING_MODEL={{.AZURE_OPENAI_EMBEDDING_MODEL}}"
        echo "APPLICATIONINSIGHTS_CONNECTION_STRING={{.APPLICATIONINSIGHTS_CONNECTION_STRING}}"
    silent: true
    vars:
      AZURE_OPENAI_MODEL: gpt-5.4-mini
      AZURE_OPENAI_EMBEDDING_MODEL: text-embedding-ada-002
      AZURE_OPENAI_ENDPOINT:
        sh: terraform -chdir=./{{.INFRA_DIR}} output -raw openai_endpoint
      AZURE_CLIENT_ID:
        sh: terraform -chdir=./{{.INFRA_DIR}} output -raw banking_services_client_id
      APPLICATIONINSIGHTS_CONNECTION_STRING:
        sh: terraform -chdir=./{{.INFRA_DIR}} output -raw application_insights_connection_string

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf src/**/bin src/**/obj
      - rm -rf node_modules dist

  build:
    desc: Build all container images using Azure ACR
    cmds:
      - task: build:dotnet
      - task: build:python
      - task: build:ui

  build:dotnet:
    desc: Build all .NET service images
    cmds:
      - az acr build --registry {{.ACR_NAME}} --image user-service:{{.TAG}} -f ./src/user-service/Dockerfile .
      - az acr build --registry {{.ACR_NAME}} --image account-service:{{.TAG}} -f ./src/account-service/Dockerfile .
      - az acr build --registry {{.ACR_NAME}} --image transaction-service:{{.TAG}} -f ./src/transaction-service/Dockerfile .
      - az acr build --registry {{.ACR_NAME}} --image transfer-service:{{.TAG}} -f ./src/transfer-service/Dockerfile .

  build:python:
    desc: Build all Python service images
    cmds:
      - az acr build --registry {{.ACR_NAME}} --image chatbot-service:{{.TAG}} ./src/chatbot-service/
      - az acr build --registry {{.ACR_NAME}} --image budget-service:{{.TAG}} ./src/budget-service/
      - az acr build --registry {{.ACR_NAME}} --image ai-service:{{.TAG}} ./src/ai-service/
      - az acr build --registry {{.ACR_NAME}} --image event-processor:{{.TAG}} ./src/event-processor/

  build:ui:
    desc: Build UI application image
    cmds:
      - az acr build --registry {{.ACR_NAME}} --image ui-app:{{.TAG}} ./src/ui-app/

  deploy:
    desc: Deploy application to Kubernetes cluster (updates image refs then applies)
    cmds:
      - task: _images:update
      - kubectl apply -k deploy/kustomize/observability/
      - kubectl apply -k deploy/kustomize/base/
      - task: _configmap:update
      - task: _secretproviderclass:update
      - kubectl apply -f cluster-config/istio/gateway/istio-ingress-gateway.yaml
      - kubectl apply -f cluster-config/istio/gateway/default-ingress.yaml

  # === One-time infra configuration ===
  # Run after Terraform creates AKS. Sets up credentials, namespaces, secrets,
  # configmap values, secret-provider-class, and optionally TLS via cert-manager.
  # DNS SETUP: Create a DNS A record pointing CUSTOM_DOMAIN to the Istio ingress
  # gateway external IP. Get the IP with: kubectl get svc -n aks-istio-ingress

  infra:config:
    desc: One-time AKS configuration (credentials, namespaces, secrets, configmap, CSI, TLS)
    cmds:
      - az aks get-credentials --resource-group {{.RG_NAME}} --name {{.AKS_NAME}} --overwrite-existing
      - sed -i s/devicecode/azurecli/g ~/.kube/config
      - task: infra:tls
      - task: _secrets:create
      - task: _configmap:update
      - task: _secretproviderclass:update
    vars:
      RG_NAME:
        sh: terraform -chdir=./{{.INFRA_DIR}} output -raw resource_group_name
      AKS_NAME:
        sh: terraform -chdir=./{{.INFRA_DIR}} output -raw aks_name

  infra:tls:
    desc: Install cert-manager, issue Let's Encrypt cert, and enable HTTPS gateway
    preconditions:
      - sh: '[ -n "$CUSTOM_DOMAIN" ]'
        msg: "CUSTOM_DOMAIN must be set in .env before running infra:tls"
    cmds:
      # 1. Install cert-manager
      - helm repo add jetstack https://charts.jetstack.io --force-update
      - helm upgrade --install cert-manager jetstack/cert-manager --namespace cert-manager --create-namespace --set crds.enabled=true --wait
      # 2. Ensure HTTP-only gateway is active (no HTTPS redirect during challenge)
      - kubectl apply -f cluster-config/istio/gateway/istio-ingress-gateway.yaml
      # 3. Apply ClusterIssuer and Certificate
      - kubectl apply -f cluster-config/cert-manager/clusterissuer.yaml
      - envsubst < cluster-config/cert-manager/certificate.yaml | kubectl apply -f -
      # 4. Wait for ACME solver pod, then route challenge traffic to it
      - task: _tls:wait-for-solver
      - task: _tls:route-solver
      # 5. Wait for certificate to be issued
      - task: _tls:wait-for-cert
      # 6. Clean up solver route and apply TLS gateway
      - kubectl delete virtualservice acme-solver -n aks-istio-ingress --ignore-not-found
      - envsubst < cluster-config/istio/gateway/istio-ingress-gateway-tls.yaml | kubectl apply -f -
      - echo "✅ TLS enabled for $CUSTOM_DOMAIN"

  _tls:wait-for-solver:
    internal: true
    desc: Wait for cert-manager ACME HTTP solver pod to appear
    cmds:
      - |
        echo "Waiting for ACME solver pod..."
        for i in $(seq 1 30); do
          SVC=$(kubectl get svc -n aks-istio-ingress -l "acme.cert-manager.io/http01-solver=true" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
          if [ -n "$SVC" ]; then
            echo "Solver service found: $SVC"
            break
          fi
          sleep 5
        done
        if [ -z "$SVC" ]; then
          echo "ERROR: ACME solver service not found after 150s"
          exit 1
        fi

  _tls:route-solver:
    internal: true
    desc: Create VirtualService to route ACME challenge to solver pod
    cmds:
      - |
        SVC=$(kubectl get svc -n aks-istio-ingress -l "acme.cert-manager.io/http01-solver=true" -o jsonpath='{.items[0].metadata.name}')
        cat <<EOF | kubectl apply -f -
        apiVersion: networking.istio.io/v1beta1
        kind: VirtualService
        metadata:
          name: acme-solver
          namespace: aks-istio-ingress
        spec:
          hosts:
          - "$CUSTOM_DOMAIN"
          gateways:
          - banking-demo-gateway
          http:
          - match:
            - uri:
                prefix: /.well-known/acme-challenge/
            route:
            - destination:
                host: ${SVC}.aks-istio-ingress.svc.cluster.local
                port:
                  number: 8089
        EOF

  _tls:wait-for-cert:
    internal: true
    desc: Wait for certificate to be issued (up to 5 minutes)
    cmds:
      - |
        echo "Waiting for certificate to be issued..."
        for i in $(seq 1 60); do
          READY=$(kubectl get certificate banking-demo-tls -n aks-istio-ingress -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null)
          if [ "$READY" = "True" ]; then
            echo "✅ Certificate issued successfully"
            exit 0
          fi
          sleep 5
        done
        echo "ERROR: Certificate not ready after 5 minutes"
        kubectl describe certificate banking-demo-tls -n aks-istio-ingress
        exit 1

  infra:tls:status:
    desc: Check TLS certificate status
    cmds:
      - kubectl get certificate -n aks-istio-ingress
      - kubectl get certificaterequest -n aks-istio-ingress
      - kubectl get challenges -n aks-istio-ingress 2>/dev/null || true

  # === Internal tasks ===
  _secrets:create:
    internal: true
    desc: Create namespaces, observability secret, and workload identity service account
    cmds:
      - kubectl create namespace banking-demo --dry-run=client -o yaml | kubectl apply -f -
      - kubectl create namespace observability --dry-run=client -o yaml | kubectl apply -f -
      - |
        kubectl create secret generic banking-secrets \
          --namespace observability \
          --from-literal=appinsights-connection-string="{{.APPINSIGHTS_CONN}}" \
          --dry-run=client -o yaml | kubectl apply -f -
      - |
        cat <<EOF | kubectl apply -f -
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: banking-workload-identity
          namespace: banking-demo
          annotations:
            azure.workload.identity/client-id: "{{.AZURE_CLIENT_ID}}"
          labels:
            azure.workload.identity/use: "true"
        EOF
    vars:
      APPINSIGHTS_CONN:
        sh: terraform -chdir=./{{.INFRA_DIR}} output -raw application_insights_connection_string
      AZURE_CLIENT_ID:
        sh: terraform -chdir=./{{.INFRA_DIR}} output -raw banking_services_client_id

  _images:update:
    internal: true
    desc: Update Kustomize image references to ACR
    dir: deploy/kustomize/base
    cmds:
      - kustomize edit set image ghcr.io/banking-demo/user-service={{.ACR_LOGIN_SERVER}}/user-service:{{.TAG}}
      - kustomize edit set image ghcr.io/banking-demo/account-service={{.ACR_LOGIN_SERVER}}/account-service:{{.TAG}}
      - kustomize edit set image ghcr.io/banking-demo/transaction-service={{.ACR_LOGIN_SERVER}}/transaction-service:{{.TAG}}
      - kustomize edit set image ghcr.io/banking-demo/transfer-service={{.ACR_LOGIN_SERVER}}/transfer-service:{{.TAG}}
      - kustomize edit set image ghcr.io/banking-demo/chatbot-service={{.ACR_LOGIN_SERVER}}/chatbot-service:{{.TAG}}
      - kustomize edit set image ghcr.io/banking-demo/budget-service={{.ACR_LOGIN_SERVER}}/budget-service:{{.TAG}}
      - kustomize edit set image ghcr.io/banking-demo/ai-service={{.ACR_LOGIN_SERVER}}/ai-service:{{.TAG}}
      - kustomize edit set image ghcr.io/banking-demo/event-processor={{.ACR_LOGIN_SERVER}}/event-processor:{{.TAG}}
      - kustomize edit set image ghcr.io/banking-demo/ui-app={{.ACR_LOGIN_SERVER}}/ui-app:{{.TAG}}
      - kustomize edit set image ghcr.io/banking-demo/prompt-eval-service={{.ACR_LOGIN_SERVER}}/prompt-eval-service:{{.TAG}}

  _configmap:update:
    internal: true
    desc: Substitute Cosmos endpoint in configmap, apply, then restore
    cmds:
      - sed -i "s|REPLACE_WITH_COSMOS_ENDPOINT|{{.COSMOS_ENDPOINT}}|g" deploy/kustomize/base/configmap.yaml
      - kubectl apply -f deploy/kustomize/base/configmap.yaml -n banking-demo
      - git checkout deploy/kustomize/base/configmap.yaml
    vars:
      COSMOS_ENDPOINT:
        sh: terraform -chdir=./{{.INFRA_DIR}} output -raw cosmos_db_endpoint

  _secretproviderclass:update:
    internal: true
    desc: Substitute KV/identity values in SecretProviderClass, apply, then restore
    cmds:
      - sed -i "s|REPLACE_WITH_KEYVAULT_NAME|{{.KEYVAULT_NAME}}|g" deploy/kustomize/base/secret-provider-class.yaml
      - sed -i "s|REPLACE_WITH_TENANT_ID|{{.TENANT_ID}}|g" deploy/kustomize/base/secret-provider-class.yaml
      - sed -i "s|REPLACE_WITH_AZURE_CLIENT_ID|{{.AZURE_CLIENT_ID}}|g" deploy/kustomize/base/secret-provider-class.yaml
      - kubectl apply -f deploy/kustomize/base/secret-provider-class.yaml -n banking-demo
      - git checkout deploy/kustomize/base/secret-provider-class.yaml
    vars:
      KEYVAULT_NAME:
        sh: terraform -chdir=./{{.INFRA_DIR}} output -raw key_vault_name
      TENANT_ID:
        sh: az account show --query tenantId -o tsv
      AZURE_CLIENT_ID:
        sh: terraform -chdir=./{{.INFRA_DIR}} output -raw banking_services_client_id

  _init:
    internal: true
    cmds:
      - terraform -chdir=./{{.INFRA_DIR}} init -upgrade
      - terraform -chdir=./{{.INFRA_DIR}} workspace new {{.REGION}} || true
      - terraform -chdir=./{{.INFRA_DIR}} workspace select {{.REGION}}
    vars:
      REGION: '{{default .DEFAULT_REGION .CLI_ARGS}}'